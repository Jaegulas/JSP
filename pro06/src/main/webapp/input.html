<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	<!-- 서블릿(InputServlet 서버페이지)으로 요청하는 클라이언트가 보는 디자인 요청화면   -->

	<!-- 서블릿 요청시 요청할 매핑 주소 : http://localhost:8181/pro06/input -->

	<form action="/pro06/input"  method="get" name="frmInput">
	
		아이디 : <input type="text" name="user_id" value="">       <br> <!-- (user_id-admin)  -->
		비밀번호 : <input type="password" name="user_pw" value="" > <br> <!-- (user_pw-1234) -->
		
		<!-- 
		여러개의 <input>을 만들때 체크박스를 사용해서 value 속성값을 설정하는 것이 좋습니다.
		체크박스의 name 속성값은 모두 subject 이므로  서블릿(서버페이지)로 전송 요청할때
		여러개의 <input type="checkbox">들 중에 체크되어 있는 <input type="checkbox">에 설정된 value 속성값들만
		모두 String 문자열 배열에 담고~~  HttpServletRequest객체 메모리에 저장후 전송합니다.
		 -->		
		<input type="checkbox" name="subject" value="java">자바 
		<input type="checkbox" name="subject" value="c">씨
		<input type="checkbox" name="subject" value="jsp">제이에스피
		<input type="checkbox" name="subject" value="android">안드로이드
		
		<br><br>
		
		<input type="submit" value="전송요청">  <input type="reset" value="다시입력">

	</form>




</body>
</html>
