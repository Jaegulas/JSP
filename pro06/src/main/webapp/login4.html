<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
<!--
    ============================================================
    login3.html : 로그인 화면을 보여주는 정적(HTML) 문서
    ============================================================

    [1] 이 문서가 브라우저에 보이기까지의 순서 (요청 -> 응답)

        1. 사용자가 주소창에 http://localhost:8181/pro06/login3.html 입력 후 엔터
        2. 톰캣 서버가 pro06 프로젝트 폴더에서 login.html 파일을 찾음
        3. 서버가 login.html 내용을 HTTP 응답 메시지에 담아 브라우저로 전송
        4. 브라우저가 받은 HTML 태그를 해석해서 로그인 화면을 그려줌

        [브라우저] --(1.요청: login3.html 주세요)--▶[서버(톰캣)]
        [브라우저] ◀--(3.응답: login3.html 내용)--- [서버(톰캣)]

    [2] 이 화면에서 로그인 버튼을 누르면 일어나는 일

        - 전송 주소 : http://localhost:8181/pro06/login  (서블릿 주소)
        - 아이디 입력칸에 admin 입력 시  -> user_id=admin  형태로 묶여서 전송
        - 비밀번호 입력칸에 1234 입력 시 -> user_pw=1234   형태로 묶여서 전송
        - 전송된 데이터는 서블릿의 HttpServletRequest 객체 안에 담겨 도착함

        [login3.html 입력값] --(user_id=admin&user_pw=1234)--▶ [LoginServlet]
-->
	<!-- form 태그 : 입력값을 모아서 서버(서블릿)로 전송하는 태그 
		 action="login" : 전송 목적이 주소 (pro06/login3 서블릿)
		 method="get"   : GET 방식으로 전송 (브라우저 주소창에 데이터 보이면서 요청하는 방식으로 전송)
		 name="frmLogin" : 이 <form>태그의 이름 설정 (자바스크립트에서 <form> 선택할때 사용)
	 -->
	<form action="login4" method="get" name="frmLogin"  >	
		<!--  아이디 입력칸. name="user_id"가 전송될 데이터의 이름표가 됨
			  예) admin 입력시  "user_id = admin" 을 만든뒤  HttpServletRequest 객체 메모리에 보관하며 전송 함
		 -->
		아이디 : <input type="text" name="user_id"> <br>
		
		<!--  비밀번호 입력칸. type="passwrod"라서 입력한 비밀번호가 *로 가려짐 
			  예) 1234 입력시  "user_pw = 1234" 로 전송 함 
		 -->
		비밀번호 : <input type="passowrd" name="user_pw"> <br>
		
		<!--  submit 버튼  : 누르면 <form>안의 입력값을 action 속성의 login 매핑 주소의 서블릿 전송 요청! -->
		<input type="submit" value="로그인">
	
		<!--  reset 버튼 :  누르면 입력칸의 내용을 전부 지우고 처음 상태로 디자인 되돌림 -->
		<input type="reset" value="다시입력">
	</form>
<!--
    ============================================================
    [3] form 태그의 주요 속성 정리
    ============================================================

    +----------+------------------------------------------------------------+
    | 속성     | 기능                                                        |
    +----------+------------------------------------------------------------+
    | name     | form의 이름. form이 여러 개일 때 구분용.                    |
    |          | 자바스크립트에서 이 form을 선택할 때 사용.                  |
    +----------+------------------------------------------------------------+
    | method   | 데이터 전송 방식 지정. get 또는 post 중 하나.               |
    +----------+------------------------------------------------------------+
    | action   | 입력값을 전송할 서버 페이지(서블릿/JSP)의 주소.             |
    +----------+------------------------------------------------------------+
    | encType  | 파일 업로드 시 multipart/form-data 로 지정해야 함.          |
    +----------+------------------------------------------------------------+

    ============================================================
    [4] GET 방식 vs POST 방식 비교
    ============================================================

    GET 방식
    - 데이터가 URL 주소 뒤에 name=value 형태로 붙어서 전송됨
      예) http://localhost:8181/pro06/login?user_id=admin&user_pw=1234
    - 데이터 여러 개는 & 기호로 연결됨
    - 주소창에 데이터가 그대로 보이므로 보안에 취약함
    - method를 안 적으면 기본값이 GET
    - 서블릿에서는 doGet() 메소드가 이 요청을 받아 처리함
    - 적은 양의 간단한 데이터 전송에 적합 (검색어 등)
    - 로그인, 개인정보 같은 민감한 데이터 전송에는 부적합

    POST 방식
    - 데이터가 URL이 아닌 HTTP 요청 본문(body)에 담겨 전송됨
    - 주소창에 데이터가 보이지 않으므로 GET보다 보안성이 높음
    - 대용량 데이터, 민감한 정보(로그인/개인정보) 전송에 적합
    - 서블릿에서는 doPost() 메소드가 이 요청을 받아 처리함

    ============================================================
    [5] 예상 화면 (브라우저 출력)
    ============================================================

    아이디 : [ admin      ]
    비밀번호 : [ ****      ]
    [로그인] [다시입력]

    로그인 버튼 클릭 시 이동 주소(GET 방식이라 데이터 노출):
    http://localhost:8090/pro06/login?user_id=admin&user_pw=1234

    ============================================================
    [6] 핵심 정리 (3줄)
    ============================================================
    1. form은 입력값을 모아 action 주소(서블릿)로 전송하는 태그다.
    2. input의 name 속성값이 전송 데이터의 이름표(user_id=admin)가 된다.
    3. GET은 주소창에 데이터가 노출되고, POST는 본문에 숨겨져 전송된다.
-->

</body>
</html>
