<!--
================================================================================
 파일명   : 1_coin.html
 주제     : jQuery $.ajax 로 실시간 시세 조회하기 (자동 갱신 포함)
 대상     : 비전공자 (자바스크립트를 처음 배우는 상태)
================================================================================

 이 파일에서 배우는 것
 ==========================================================================
 1. 화면이 열리자마자 자동으로 서버를 부르는 방법
 2. 응답이 배열로 올 때 값을 꺼내는 방법
 3. setInterval 로 일정 시간마다 반복 실행하는 방법
 4. clearInterval 로 그 반복을 멈추는 방법
 5. 여러 함수가 값을 함께 쓰는 전역 변수의 개념
 6. filter, join, push, indexOf 배열 메소드 4가지


 참고. 이 화면의 전체 동작 순서
 ==========================================================================

   [브라우저]  1_coin.html
       |
       | (1) 화면이 다 그려지면 종목 목록을 먼저 요청
       |     https://api.upbit.com/v1/market/all
       V
   [업비트 서버]
       |
       | (2) 종목 코드와 한글 이름이 담긴 배열 응답
       V
   [브라우저]
       |
       | (3) 그 중 원화(KRW) 종목만 골라 선택상자를 채움
       | (4) 시세 요청
       |     https://api.upbit.com/v1/ticker?markets=KRW-BTC,KRW-ETH,KRW-XRP
       V
   [업비트 서버]
       |
       | (5) 현재가, 변동률 등이 담긴 배열 응답
       V
   [브라우저]
       |
       | (6) 표 영역 안쪽만 다시 그림. 페이지 전체는 새로 그려지지 않음
       | (7) 5초 뒤에 (4)번부터 자동으로 다시 실행 (계속 반복)


 참고. 동기 통신과 비동기 통신의 차이
 ==========================================================================

   [동기 통신]  = 지금까지 배운 <form> 전송 방식

     화면A ==-요청---▶ 서버 ---HTML문서 전체---▶ 화면B (완전히 새 화면)

     - 화면이 하얗게 변했다가 전체가 새로 그려집니다.
     - 주소창의 주소가 바뀝니다.
     - 5초마다 이렇게 하면 화면이 계속 깜빡여서 사용할 수 없습니다.


   [비동기 통신] = 이 파일이 사용하는 Ajax 방식

     화면A ---요청---▶ 서버 ---값(JSON)---▶ 화면A 의 표 부분만 변경

     - 화면은 그대로 있고 표 안쪽 숫자만 바뀝니다.
     - 주소창의 주소가 바뀌지 않습니다.
     - 사용자는 갱신되는 동안에도 선택상자를 계속 조작할 수 있습니다.

-->

<!DOCTYPE html>
<!-- 위 한 줄은 "이 문서는 HTML5 문법으로 작성했다" 고 브라우저에게 알려주는 선언입니다.
     항상 문서의 맨 첫 줄에 씁니다. -->

<html>
<head>
<!-- meta charset="UTF-8"
     이 문서에 적힌 한글이 깨지지 않도록 문자 저장 방식을 지정합니다.
     이 한 줄이 없으면 화면의 한글이 ??? 또는 ??? 처럼 깨져 보입니다. -->
<meta charset="UTF-8">

<!-- title 은 브라우저 탭에 표시되는 글자입니다. 화면 안에는 보이지 않습니다. -->
<title>1. 실시간 코인 시세판</title>

	<!--
		jQuery 문법을 사용하기 위해 jQuery 파일을 먼저 불러옵니다.

		src 는 "이 주소에 있는 자바스크립트 파일을 가져와 실행하라" 는 뜻입니다.

		중요. 이 줄이 없으면 아래에서 $ 를 쓰는 모든 코드가
		      "$ is not defined" 라는 오류를 내고 아무것도 동작하지 않습니다.

		중요. 이 줄은 반드시 $ 를 사용하는 코드보다 "위" 에 있어야 합니다.
		      아래에 두면 도구를 꺼내기 전에 도구를 쓰려는 것과 같습니다.

		참고. min.js 는 파일 크기를 줄이려고 공백과 줄바꿈을 모두 제거한 파일입니다.
		      기능은 완전히 같고 전송 속도만 빠릅니다.
	-->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<style type="text/css">
		/*
			아래는 화면을 보기 좋게 꾸미는 부분입니다.
			Ajax 통신과는 관계가 없으므로 처음에는 넘어가도 됩니다.
			다만 클래스 이름 4개(rise, fall, even, name)는
			아래 자바스크립트에서 직접 사용하므로 눈으로 확인해 두세요.
		*/

		/* body 는 화면 전체를 뜻합니다. 여기에 준 설정은 모든 태그에 기본으로 적용됩니다. */
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2      { color:#1d5fa8; }

		/* 점(.)으로 시작하면 class 이름을 뜻합니다.
		   <div class="box"> 처럼 쓴 태그에만 적용됩니다. */
		.box    { background:#fff; border:1px solid #cbd5e2; border-radius:8px;
		          padding:20px; max-width:760px; }

		select  { padding:6px; border:1px solid #93a5bd; border-radius:4px; width:220px; }
		button  { background:#1d5fa8; color:#fff; border:none; padding:8px 16px;
		          border-radius:6px; cursor:pointer; font-size:14px; }

		/* 자동갱신이 꺼졌을 때 버튼을 회색으로 바꾸기 위한 클래스입니다.
		   자바스크립트가 addClass("off") 로 이 클래스를 붙였다 뗐다 합니다. */
		button.off { background:#8fa2bb; }

		table   { border-collapse:collapse; width:100%; margin-top:16px; }
		th,td   { border:1px solid #cbd5e2; padding:9px; font-size:14px; text-align:right; }
		th      { background:#e8f0fb; color:#1d5fa8; text-align:center; }

		/* td.name 은 "class 가 name 인 td 태그" 라는 뜻입니다.
		   종목 이름 칸만 왼쪽 정렬하고 굵게 표시합니다. */
		td.name { text-align:left; font-weight:bold; }

		/* 아래 3개는 자바스크립트가 상승·하락 여부에 따라 골라서 붙이는 클래스입니다.
		   국내 증권사 관례상 상승이 빨강, 하락이 파랑입니다.
		   (미국은 반대로 상승이 초록, 하락이 빨강입니다) */
		.rise   { color:#c0392b; font-weight:bold; }
		.fall   { color:#1d5fa8; font-weight:bold; }
		.even   { color:#6b7c93; }

		.stat   { margin-top:10px; font-size:13px; color:#6b7c93; }
		.err    { color:#c0392b; font-weight:bold; }
		.note   { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
</head>
<body>

<h2>1. $.ajax — 실시간 코인 시세판</h2>

<div class="box">

	<!--
		select 태그는 여러 항목 중 하나를 고르는 선택상자입니다.

		id="marketSel"
		  이 태그에 "marketSel" 이라는 이름표를 붙였습니다.
		  자바스크립트가 이 이름표를 보고 이 태그를 찾아냅니다.

		지금은 안쪽에 option 이 하나뿐이지만,
		화면이 열릴 때 자바스크립트가 종목 수백 개로 통째로 교체합니다.

		참고. option 태그의 구조
		      <option value="KRW-BTC">비트코인 (KRW-BTC)</option>
		                    ======-  ====================
		                    실제 값        화면에 보이는 글자
	-->
	종목 추가 :
	<select id="marketSel"><option>불러오는 중...</option></select>

	<!--
		여기서는 onclick 속성을 쓰지 않았습니다.
		아래 스크립트에서 $("#addBtn").on("click", ...) 으로 이벤트를 등록합니다.

		이렇게 화면 태그와 동작 코드를 분리하는 방식이 실무 권장 방식입니다.
		화면만 보면 디자인을, 스크립트만 보면 동작을 파악할 수 있기 때문입니다.
	-->
	<button id="addBtn">추가</button>
	<button id="toggleBtn">자동갱신 끄기</button>

	<!--
		시세 표가 이 div 안쪽에만 그려집니다.
		지금은 비어 있고, 자바스크립트가 table 태그를 통째로 만들어 넣습니다.

		중요. 5초마다 바뀌는 것은 이 div 안쪽뿐입니다.
		      위의 선택상자와 버튼은 전혀 건드리지 않습니다.
		      그래서 사용자가 종목을 고르는 중에 갱신이 일어나도 방해받지 않습니다.
	-->
	<div id="result"></div>

	<!-- 마지막으로 갱신한 시각을 표시할 자리입니다. -->
	<div class="stat" id="stat"></div>

	<p class="note">5초마다 자동으로 다시 조회합니다.
	   F12 → Network 탭을 열어 두면 5초마다 요청이 새로 발생하는 것을 확인할 수 있습니다.</p>
</div>

<script type="text/javascript">

	//===================================================================
	//0. 화면 전체에서 함께 쓰는 변수 선언 (전역 변수)
	//===================================================================

	//0.1 조회할 종목 코드를 담아 둘 배열입니다.
	//
	//    대괄호 [ ] 는 여러 값을 순서대로 담는 배열을 뜻합니다.
	//    처음에는 3개로 시작하고, 추가 버튼을 누르면 늘어납니다.
	//
	//    배열의 칸 번호는 0부터 시작합니다.
	//      종목목록[0] -> "KRW-BTC"
	//      종목목록[1] -> "KRW-ETH"
	//      종목목록[2] -> "KRW-XRP"
	//
	//    참고. 종목 코드의 의미
	//      KRW-BTC  ->  원화(KRW)로 비트코인(BTC)을 사고파는 시장
	//      앞이 결제 통화, 뒤가 코인 이름입니다.
	let 종목목록 = ["KRW-BTC", "KRW-ETH", "KRW-XRP"];

	//0.2 setInterval 이 돌려주는 예약 번호를 담아 둘 변수입니다.
	//
	//    나중에 자동갱신을 멈출 때 이 번호가 반드시 필요합니다.
	//    번호를 저장해 두지 않으면 한 번 시작한 반복을 영원히 멈출 수 없습니다.
	//
	//    선언만 하고 값을 넣지 않으면 undefined(아무것도 없음)가 들어 있습니다.
	let 갱신예약;

	//0.3 종목 코드에 대한 한글 이름을 저장해 둘 객체입니다.
	//
	//    중괄호 { } 는 "이름 : 값" 짝을 담는 객체를 뜻합니다.
	//    처음에는 비어 있고, 종목 목록을 받으면 아래처럼 채워집니다.
	//
	//      { "KRW-BTC" : "비트코인",
	//        "KRW-ETH" : "이더리움",
	//        "KRW-XRP" : "리플" }
	//
	//    시세 API 는 한글 이름을 주지 않고 코드만 줍니다.
	//    그래서 목록 API 에서 받은 이름을 여기에 따로 보관해 두었다가
	//    표를 그릴 때 꺼내 씁니다.
	let 한글이름 = {};


	//===================================================================
	//1. 화면이 준비되면 실행되는 부분
	//===================================================================
	/*
		참고. $(function(){ ... }) 문법의 정확한 의미

			"HTML 문서를 브라우저가 다 읽고 나면 이 안의 코드를 실행하라" 는 뜻입니다.

			아래 두 가지는 완전히 같은 뜻입니다.
			  $(document).ready(function(){ ... });     <- 원래 표기
			  $(function(){ ... });                     <- 줄임 표기

		참고. 왜 이렇게 감싸야 하는가

			브라우저는 HTML 을 위에서 아래로 순서대로 읽습니다.
			만약 script 가 화면 태그보다 위에 있다면,
			$("#marketSel") 을 찾는 순간 그 태그는 아직 만들어지지 않은 상태입니다.

			그러면 아무 태그도 못 찾고, 오류도 나지 않은 채
			조용히 아무 일도 일어나지 않습니다. 원인을 찾기 매우 어렵습니다.

			이 문법으로 감싸면 화면이 다 만들어진 뒤에 실행되므로 안전합니다.
	*/
	$(function(){

		//1.1 종목 목록을 먼저 불러와 선택상자를 채웁니다.
		종목목록불러오기();

		//1.2 시세를 한 번 조회합니다.
		//
		//    이 줄이 없으면 화면을 연 뒤 5초 동안 표가 비어 있게 됩니다.
		//    첫 조회를 즉시 하고, 이후부터 5초 간격으로 반복하는 것입니다.
		시세조회();

		//1.3 5초마다 자동으로 다시 조회하도록 예약합니다.
		//
		//    setInterval(실행할함수, 밀리초)
		//      -> 지정한 시간마다 함수를 "계속 반복" 실행합니다.
		//      -> 1000 밀리초 = 1초 이므로 5000 은 5초입니다.
		//      -> 예약 번호(숫자)를 돌려주므로 변수에 저장해 둡니다.
		//
		//    참고. setTimeout 과의 차이 (매우 중요)
		//      setTimeout  : 지정한 시간 뒤에 딱 "한 번" 실행하고 끝납니다.
		//      setInterval : 지정한 시간마다 "계속 반복" 실행합니다.
		//
		//    주의. 함수 이름 뒤에 소괄호를 붙이지 않습니다.
		//      setInterval(시세조회, 5000)     <- 맞음. 5초마다 실행하라고 넘김
		//      setInterval(시세조회(), 5000)   <- 틀림. 지금 즉시 실행하고 그 결과를 넘김
		갱신예약 = setInterval(시세조회, 5000);
	});


	//===================================================================
	//2. 종목 목록 불러오기 (선택상자 채우기)
	//===================================================================
	function 종목목록불러오기(){

		//2.0 $.ajax({ 설정 : 값, ... }) 형태로 중괄호 안에 설정을 나열합니다.
		$.ajax({

			//요청할 서버 페이지 주소입니다.
			//
			//  지금까지는 "calc.jsp" 처럼 우리 톰캣서버의 파일이었지만
			//  이번에는 https:// 로 시작하는 외부 회사의 전체 주소를 씁니다.
			//
			//  문법은 완전히 같습니다. url 이 우리 서버가 아닐 뿐입니다.
			//
			//  참고. 이 주소를 브라우저 주소창에 그대로 붙여넣어도 결과를 볼 수 있습니다.
			url  : "https://api.upbit.com/v1/market/all",

			//요청 전송 방식입니다.
			//  get  : 값이 주소 뒤에 ?이름=값 형태로 붙습니다. 조회할 때 사용
			//  post : 값이 본문에 숨겨져 전송됩니다. 저장·수정·삭제할 때 사용
			type : "get",

			//서버가 응답할 것으로 예상하는 데이터 형식입니다.
			//
			//  json 으로 지정하면 jQuery 가 응답받은 글자 덩어리를
			//  자바스크립트 배열이나 객체로 자동 변환해 줍니다.
			//
			//  이 줄이 없거나 text 로 지정하면 값을 하나씩 꺼낼 수 없습니다.
			dataType : "json",

			//통신에 성공했을 때 jQuery 가 자동으로 호출하는 콜백함수입니다.
			//
			//  참고. 콜백함수란
			//        내가 직접 호출하지 않고, 특정 상황이 되면
			//        시스템이 대신 호출해 주는 함수를 말합니다.
			//
			//  매개변수 response 에 서버가 응답한 데이터가 담겨서 넘어옵니다.
			success : function(response){
				/*
					response 로 받은 데이터의 실제 모습

					[
					  { "market":"KRW-BTC", "korean_name":"비트코인",   "english_name":"Bitcoin" },
					  { "market":"BTC-FIL", "korean_name":"파일코인",   "english_name":"Filecoin" },
					  { "market":"USDT-ETH","korean_name":"이더리움",   "english_name":"Ethereum" },
					  .....
					]

					대괄호로 시작하므로 배열입니다.
					각 칸에 중괄호로 된 객체가 하나씩 들어 있습니다.

					주의. 원화(KRW) 종목뿐 아니라
					     BTC 마켓(비트코인으로 사는 시장),
					     USDT 마켓(테더로 사는 시장)도 함께 들어 있습니다.

					     전부 보여주면 목록이 수백 개가 되어 학생이 찾을 수 없습니다.
					     그래서 원화 종목만 골라냅니다.
				*/

				//---------------------------------------------------------
				//2.1 원화 종목만 골라내기
				//---------------------------------------------------------
				/*
					참고. filter 메소드

						배열의 각 칸을 하나씩 검사해서
						조건이 참인 칸만 골라 "새 배열" 을 만들어 돌려줍니다.

							[1, 2, 3, 4].filter(n => n > 2)   ->   [3, 4]

						원본 배열은 전혀 바뀌지 않습니다.

					참고. indexOf 메소드

						찾는 글자가 몇 번째 위치에 있는지 알려 줍니다.
						없으면 -1 을 돌려줍니다.

							"KRW-BTC".indexOf("KRW-")   ->  0   (맨 앞에 있음)
							"BTC-FIL".indexOf("KRW-")   ->  -1  (없음)

						=== 0 인지 검사하는 이유는
						"맨 앞에서 시작하는 것" 만 원화 종목이기 때문입니다.

					참고. === 와 == 의 차이
						=== 는 값과 자료형이 모두 같은지 검사합니다.
						==  는 자료형을 무시하고 비교합니다.
						실무에서는 항상 === 를 사용합니다.
				*/
				const 원화종목 = response.filter(function(item){
					//return 은 "이 값을 돌려준다" 는 뜻입니다.
					//여기서 true 를 돌려준 칸만 새 배열에 담깁니다.
					return item.market.indexOf("KRW-") === 0;
				});

				//---------------------------------------------------------
				//2.2 선택상자에 넣을 option 태그들을 만들기
				//---------------------------------------------------------
				//let 을 쓰는 이유는 아래 반복문에서 값을 계속 덧붙이기 때문입니다.
				//처음에는 빈 글자 "" 로 시작합니다.
				let html = "";

				/*
					참고. $.each 반복 메소드 문법

						$.each(순회할배열, function(인덱스, 값){
							반복해서 실행할 코드;
						});

						인덱스 : 지금 몇 번째 칸인지를 나타내는 숫자 (0부터 시작)
						값     : 그 칸에 들어 있는 실제 데이터 (여기서는 객체 하나)

					참고. 기본 자바스크립트로는 아래처럼 씁니다.
						원화종목.forEach(function(item, i){ ... });
				*/
				$.each(원화종목, function(i, item){

					//2.2.1 한글 이름을 나중에 쓰기 위해 객체에 저장해 둡니다.
					//
					//      한글이름["KRW-BTC"] = "비트코인";
					//
					//      참고. 대괄호 표기법을 쓰는 이유
					//            꺼내거나 넣을 키 이름이 변수(item.market)에 담겨 있기 때문입니다.
					//
					//              한글이름.item.market   <- 틀림
					//              한글이름[item.market]  <- 맞음
					//
					//      참고. 점 표기법과 대괄호 표기법
					//            한글이름.KRW      와  한글이름["KRW"]  는 같은 뜻입니다.
					//            키 이름을 직접 알 때는 점을,
					//            변수에 담겨 있을 때는 대괄호를 씁니다.
					한글이름[item.market] = item.korean_name;

					//2.2.2 option 태그 하나를 만들어 뒤에 덧붙입니다.
					//
					//      += 는 "기존 값 뒤에 덧붙여라" 는 뜻입니다.
					//        a = a + b   와   a += b   는 같은 뜻입니다.
					//
					//      + 기호는 글자와 글자를 이어붙이는 역할입니다.
					//
					//      완성되는 태그의 모습
					//        <option value="KRW-BTC">비트코인 (KRW-BTC)</option>
					html += '<option value="' + item.market + '">'
					      + item.korean_name + ' (' + item.market + ')'
					      + '</option>';
				});

				//---------------------------------------------------------
				//2.3 선택상자 안쪽을 통째로 교체합니다.
				//---------------------------------------------------------
				/*
					참고. 자주 쓰는 jQuery 출력 메소드

						.html("값")   -> 기존 내용을 지우고 HTML 태그로 해석해서 넣습니다.
						.text("값")   -> 기존 내용을 지우고 글자 그대로 넣습니다.
						.append("값") -> 기존 내용 뒤에 덧붙입니다.
						.val("값")    -> input, select 같은 입력칸의 값을 바꿉니다.

					여기서는 option 이라는 "태그" 를 만들어 넣는 것이므로
					반드시 .html() 을 써야 합니다.
					.text() 를 쓰면 <option value=... 라는 글자가 그대로 보입니다.
				*/
				$("#marketSel").html(html);
			},

			//통신에 실패했을 때 jQuery 가 자동으로 호출하는 콜백함수입니다.
			//
			//  참고. fetch 와 달리 jQuery 는 404, 500 이 오면 자동으로 여기로 옵니다.
			//        fetch 에서 res.ok 를 직접 검사해야 했던 것과 다른 점입니다.
			//
			//  목록을 못 가져와도 시세 조회는 계속 되도록 안내 문구만 바꿉니다.
			//  화면 전체를 멈추지 않는 것이 중요합니다.
			error : function(){
				$("#marketSel").html('<option>목록을 불러오지 못했습니다</option>');
			}
		});
	}


	//===================================================================
	//3. 시세 조회하기 (5초마다 반복 실행되는 함수)
	//===================================================================
	function 시세조회(){

		//---------------------------------------------------------------
		//3.1 종목 코드 배열을 콤마로 이어붙인 하나의 글자로 만들기
		//---------------------------------------------------------------
		/*
			참고. join 메소드

				배열의 각 칸을 하나의 문자열로 이어 붙입니다.
				괄호 안의 값이 각 칸 사이에 끼어들 구분자입니다.

					["가","나","다"].join(",")    ->  "가,나,다"
					["가","나","다"].join("")     ->  "가나다"
					["가","나","다"].join(" - ")  ->  "가 - 나 - 다"

			참고. 왜 하나로 합치는가

				업비트는 종목을 콤마로 구분해서 한 번에 여러 개 물어볼 수 있습니다.

					종목마다 따로 요청 -> 요청 3번 발생
					콤마로 합쳐 요청   -> 요청 1번이면 끝

				요청 횟수가 적을수록 빠르고 서버에도 부담이 적습니다.
				업비트는 초당 요청 횟수에 제한이 있으므로 반드시 합쳐서 보냅니다.
		*/
		const 코드들 = 종목목록.join(",");

		//---------------------------------------------------------------
		//3.2 $.ajax 로 시세 요청
		//---------------------------------------------------------------
		$.ajax({
			url  : "https://api.upbit.com/v1/ticker",
			type : "get",

			//서버로 보낼 요청 데이터를 "이름 : 값" 형태의 객체로 작성합니다.
			//
			//  jQuery 가 이 객체를 자동으로 아래 형태로 바꿔 주소 뒤에 붙여 줍니다.
			//    ?markets=KRW-BTC,KRW-ETH,KRW-XRP
			//
			//  완성되는 실제 요청 주소
			//    https://api.upbit.com/v1/ticker?markets=KRW-BTC,KRW-ETH,KRW-XRP
			//
			//  참고. 쿼리 스트링의 구조
			//    ? : 여기서부터 보낼 값이 시작된다는 표시
			//    = : 왼쪽이 이름, 오른쪽이 값
			//    & : 값을 여러 개 이어붙일 때 쓰는 구분자
			//
			//  참고. 특수문자 처리도 jQuery 가 알아서 해 줍니다.
			//        기본 자바스크립트라면 encodeURIComponent 를 직접 써야 합니다.
			data : { markets : 코드들 },

			dataType : "json",

			success : function(response){
				/*
					response 로 받은 데이터의 실제 모습 (배열입니다)

					[
					  {
					    "market"              : "KRW-BTC",       <- 종목 코드
					    "trade_price"         : 110860000,       <- 현재가
					    "change"              : "FALL",          <- RISE 상승 / EVEN 보합 / FALL 하락
					    "change_price"        : 66000,           <- 전일 대비 변동 금액 (항상 양수)
					    "signed_change_rate"  : -0.0005949913,   <- 변동률. 음수 부호가 붙어 있음
					    "acc_trade_price_24h" : 123456789000     <- 24시간 누적 거래대금
					  },
					  { ..... },
					  { ..... }
					]

					주의. 종목을 1개만 물어봐도 배열로 옵니다.
					     그래서 반복문으로 처리하는 것이 항상 안전합니다.

					주의. change_price 는 항상 양수입니다. 부호가 없습니다.
					     오르내림은 change 값(RISE/FALL)으로 판단해야 합니다.
					     반대로 signed_change_rate 에는 부호가 붙어 있습니다.
					     이름에 signed 가 붙은 것이 "부호가 있다" 는 뜻입니다.
				*/

				//---------------------------------------------------------
				//3.3 표의 제목 줄을 먼저 만듭니다.
				//---------------------------------------------------------
				//let 을 쓰는 이유는 아래 반복문에서 계속 덧붙이기 때문입니다.
				let html = '<table>';

				//th 는 표의 제목 칸, td 는 내용 칸입니다.
				//제목 줄은 반복문 "바깥" 에 있으므로 한 번만 만들어집니다.
				html += '<tr><th>종목</th><th>현재가</th><th>전일대비</th>'
				      + '<th>변동률</th><th>거래대금(24H)</th></tr>';

				//---------------------------------------------------------
				//3.4 배열의 칸 수만큼 반복하면서 표의 한 줄씩 만듭니다.
				//---------------------------------------------------------
				//종목이 3개면 이 안쪽 코드가 3번 실행되어 tr 이 3줄 만들어집니다.
				$.each(response, function(i, item){

					//3.4.1 상승·하락에 따라 글자 색과 부호 기호를 정합니다.
					//
					//      기본값을 보합(even)으로 잡아 두고,
					//      조건에 맞으면 바꾸는 방식입니다.
					//
					//      이렇게 하면 change 값이 예상 밖의 값이어도
					//      화면이 깨지지 않고 회색으로 표시됩니다.
					let 색 = "even";
					let 기호 = "";

					//if ~ else if 는 위에서부터 순서대로 검사하다가
					//참인 것을 만나면 그것만 실행하고 나머지는 건너뜁니다.
					if(item.change === "RISE"){
						색 = "rise";  기호 = "▲";
					}else if(item.change === "FALL"){
						색 = "fall";  기호 = "▼";
					}

					//3.4.2 변동률을 퍼센트로 바꾸기
					//
					//      signed_change_rate 는 -0.0005949913 처럼 소수로 옵니다.
					//      100 을 곱하면 -0.05949913 이 되어 퍼센트 값이 됩니다.
					//
					//      toFixed(2) 는 소수점 둘째 자리까지만 남기고 반올림합니다.
					//        (-0.05949913).toFixed(2)  ->  "-0.06"
					//
					//      주의. toFixed 의 결과는 숫자가 아니라 글자입니다.
					//           화면에 표시만 할 것이므로 문제되지 않습니다.
					const 변동률 = (item.signed_change_rate * 100).toFixed(2);

					//3.4.3 종목의 한글 이름을 꺼냅니다.
					//
					//      || 는 "또는" 이라는 뜻입니다.
					//      앞의 값이 없으면(undefined) 뒤의 값을 대신 사용합니다.
					//
					//      목록 API 가 아직 응답하지 않았거나 실패했을 때
					//      화면에 undefined 라는 글자가 찍히는 것을 막습니다.
					//      그럴 때는 한글 이름 대신 코드(KRW-BTC)가 표시됩니다.
					const 이름 = 한글이름[item.market] || item.market;

					//3.4.4 표의 한 줄을 만들어 덧붙입니다.
					//
					//      class="' + 색 + '" 부분에 주목하세요.
					//      위에서 정한 rise, fall, even 중 하나가 여기에 들어가
					//      CSS 에 정의된 색이 적용됩니다.
					html += '<tr>';
					html += '  <td class="name">' + 이름 + '</td>';
					html += '  <td>' + 콤마(item.trade_price) + '원</td>';
					html += '  <td class="' + 색 + '">' + 기호 + ' ' + 콤마(item.change_price) + '</td>';
					html += '  <td class="' + 색 + '">' + 변동률 + '%</td>';
					html += '  <td>' + 억원(item.acc_trade_price_24h) + '</td>';
					html += '</tr>';
				});

				//반복문이 끝난 뒤 표를 닫습니다.
				html += '</table>';

				//---------------------------------------------------------
				//3.5 표 영역만 다시 그립니다.
				//---------------------------------------------------------
				//페이지 전체가 새로 그려지지 않고 이 div 안쪽만 바뀝니다.
				//주소창의 주소도 바뀌지 않습니다. 이것이 Ajax 의 핵심입니다.
				$("#result").html(html);

				//---------------------------------------------------------
				//3.6 마지막 갱신 시각을 표시합니다.
				//---------------------------------------------------------
				//  new Date()             -> 지금 시각을 담은 객체를 새로 만듭니다.
				//  .toLocaleTimeString()  -> "오전 9:03:22" 같은 읽기 좋은 글자로 바꿉니다.
				//
				//  이 시각이 5초마다 바뀌는 것을 보면
				//  자동갱신이 실제로 돌고 있다는 것을 눈으로 확인할 수 있습니다.
				$("#stat").text("마지막 갱신 : " + new Date().toLocaleTimeString());
			},

			//통신에 실패했을 때 실행됩니다.
			//
			//  매개변수 xhttp 는 통신에 사용된 객체이며
			//  xhttp.status 에 상태코드가 들어 있습니다.
			//
			//  상태코드의 의미
			//    200 : 정상 처리됨
			//    404 : 요청한 주소에 페이지가 없음 (주소 오타)
			//    429 : 요청 횟수 초과 (업비트는 초당 10회 제한)
			//    500 : 서버 내부 오류
			error : function(xhttp){
				$("#result").html('<p class="err">시세를 불러오지 못했습니다. (상태코드 '
				                  + xhttp.status + ')</p>');
			}
		});
	}


	//===================================================================
	//4. 숫자를 읽기 좋게 바꾸는 함수 2개
	//===================================================================

	/*
		참고. toLocaleString() 메소드

			숫자에 천 단위 콤마를 자동으로 넣어 줍니다.

				110860000                      ->  읽기 매우 어렵습니다
				(110860000).toLocaleString()   ->  "110,860,000"

			실무에서 금액을 화면에 출력할 때 반드시 사용합니다.
			직접 3자리마다 콤마를 넣는 코드를 짤 필요가 없습니다.

		참고. Number() 로 감싼 이유

			혹시 값이 글자로 넘어와도 안전하게 숫자로 바꾸기 위해서입니다.
			글자에는 toLocaleString 을 쓸 수 없기 때문입니다.
	*/
	function 콤마(값){
		return Number(값).toLocaleString();
	}

	/*
		참고. 거래대금을 억 단위로 바꾸는 이유

			거래대금은 자리수가 너무 커서 그대로 쓰면 읽을 수 없습니다.

				123456789000        ->  몇 자리인지 셀 수 없습니다
				1,235억             ->  한눈에 읽힙니다

		계산 과정
			1) 1억(100000000)으로 나눕니다.     123456789000 / 100000000 = 1234.56
			2) Math.round 로 소수점을 반올림합니다.  1234.56 -> 1235
			3) toLocaleString 으로 콤마를 넣습니다.  1235 -> "1,235"
			4) 뒤에 "억" 을 붙입니다.                 -> "1,235억"

		참고. Math 는 자바스크립트가 기본으로 제공하는 계산 도구 모음입니다.
			Math.round(값)  -> 반올림
			Math.floor(값)  -> 내림
			Math.ceil(값)   -> 올림
	*/
	function 억원(값){
		return Math.round(Number(값) / 100000000).toLocaleString() + "억";
	}


	//===================================================================
	//5. 종목 추가 버튼
	//===================================================================
	//  $("#addBtn")               -> id 가 addBtn 인 버튼을 찾아옵니다.
	//  .on("click", function(){}) -> 그 버튼을 클릭하면 이 함수를 실행하라고 등록합니다.
	$("#addBtn").on("click", function(){

		//5.1 선택상자에서 지금 고른 값을 얻습니다.
		//
		//    .val() 은 select 태그에서 선택된 option 의 value 값을 돌려줍니다.
		//    화면에 보이는 "비트코인 (KRW-BTC)" 가 아니라
		//    value 속성에 넣어 둔 "KRW-BTC" 가 나옵니다.
		const 선택 = $("#marketSel").val();

		//5.2 이미 목록에 있으면 추가하지 않습니다.
		//
		//    indexOf 는 배열에서 그 값이 몇 번째 칸에 있는지 돌려주고,
		//    없으면 -1 을 돌려줍니다.
		//    따라서 -1 이 아니면 이미 들어 있다는 뜻입니다.
		//
		//    !== 는 "같지 않다" 는 뜻입니다. === 의 반대입니다.
		//
		//    이 검사가 없으면 같은 종목이 표에 두 줄 나타납니다.
		if(종목목록.indexOf(선택) !== -1){
			//alert 는 경고창을 띄우는 명령입니다.
			//사용자가 확인을 누를 때까지 화면이 멈춥니다.
			alert("이미 목록에 있는 종목입니다.");

			//return 은 "이 함수를 여기서 즉시 끝내라" 는 뜻입니다.
			//아래 코드는 실행되지 않습니다.
			return;
		}

		//5.3 배열 맨 뒤에 추가합니다.
		//
		//    push 는 배열 끝에 값을 하나 덧붙이는 메소드입니다.
		//      ["KRW-BTC"].push("KRW-ETH")  ->  ["KRW-BTC", "KRW-ETH"]
		//
		//    참고. 종목목록 을 let 으로 선언했지만 const 여도 동작합니다.
		//         배열 "안의 내용" 을 바꾸는 것은 const 여도 가능하기 때문입니다.
		종목목록.push(선택);

		//5.4 곧바로 다시 조회해서 화면에 반영합니다.
		//
		//    이 줄이 없으면 다음 자동갱신(최대 5초)까지 기다려야
		//    추가한 종목이 표에 나타납니다.
		//    사용자는 버튼이 고장 났다고 생각하게 됩니다.
		시세조회();
	});


	//===================================================================
	//6. 자동갱신 켜기·끄기 버튼
	//===================================================================
	$("#toggleBtn").on("click", function(){

		//6.1 지금 예약이 살아 있는지 확인합니다.
		//
		//    갱신예약 에 번호가 들어 있으면 자동갱신이 도는 중입니다.
		//    비어 있으면(null) 멈춘 상태입니다.
		//
		//    참고. 자바스크립트는 숫자 0 이 아닌 값, null 이 아닌 값을
		//         조건식에서 참으로 취급합니다.
		//         그래서 if(갱신예약) 만 써도 검사가 됩니다.
		if(갱신예약){

			//6.2 예약을 취소합니다.
			//
			//    clearInterval(예약번호) -> setInterval 로 건 반복을 멈춥니다.
			//
			//    중요. 멈추지 않으면 어떻게 되는가
			//      사용자가 다른 화면을 보고 있어도 5초마다 요청이 계속 나갑니다.
			//      요청 횟수 제한에 걸려 429 오류가 나거나
			//      서버에 불필요한 부담을 주게 됩니다.
			//      이런 코드를 실무에서 "메모리 누수" 라고 부릅니다.
			clearInterval(갱신예약);

			//번호를 비워서 "지금은 멈춘 상태" 라고 표시해 둡니다.
			//
			//  null 은 "아무것도 없음" 을 뜻하는 값입니다.
			//  이렇게 해야 다음에 버튼을 눌렀을 때 위 if 검사가 거짓이 되어
			//  아래 else 로 넘어가 다시 켜집니다.
			갱신예약 = null;

			//버튼의 글자를 바꾸고 회색 스타일을 붙입니다.
			//
			//  $(this) 는 지금 클릭된 그 버튼 자신을 가리킵니다.
			//  addClass("off") 는 그 태그에 class="off" 를 추가합니다.
			//  CSS 의 button.off 규칙이 적용되어 회색으로 바뀝니다.
			//
			//  참고. 점을 찍어 이어 쓰는 것을 메소드 체인이라고 합니다.
			//        아래 두 줄과 같은 뜻입니다.
			//          $(this).text("자동갱신 켜기");
			//          $(this).addClass("off");
			$(this).text("자동갱신 켜기").addClass("off");

		}else{
			//6.3 다시 예약을 걸어 자동갱신을 재개합니다.
			갱신예약 = setInterval(시세조회, 5000);

			//removeClass 는 붙였던 class 를 떼어냅니다.
			//회색이 사라지고 원래 파란 버튼으로 돌아옵니다.
			$(this).text("자동갱신 끄기").removeClass("off");
		}
	});

/*
	=====================================================================
	 참고. jQuery 와 fetch 의 구조 비교
	=====================================================================

		[jQuery]                          [fetch + async/await]

		success : function(){}     <->    try   { ... }
		error   : function(){}     <->    catch { ... }
		complete: function(){}     <->    finally { ... }
		(404, 500 자동으로 error)  <->    if(!res.ok) throw ...   직접 검사 필요
		dataType:"json" 자동 변환  <->    await res.json()        직접 호출 필요


	=====================================================================
	 참고. 실무에서 이 코드에 더 추가하는 것들
	=====================================================================

		1. 요청 간격 조절
		   업비트는 초당 요청 횟수에 제한이 있습니다.
		   너무 짧게 잡으면 429 오류가 납니다. 5초 이상을 권장합니다.

		2. 화면을 떠날 때 정리
		   다른 페이지로 이동할 때 clearInterval 로 반복을 반드시 멈춥니다.

		3. 이전 값과 비교해 깜빡임 효과
		   가격이 오르면 잠깐 빨간 배경을 주는 방식으로 변화를 눈에 띄게 합니다.

		4. 표 전체를 다시 그리지 않기
		   지금은 5초마다 표를 통째로 새로 만듭니다.
		   종목이 많아지면 바뀐 칸의 글자만 교체하는 방식이 더 빠릅니다.

		5. 종목 삭제 기능
		   추가만 되고 뺄 수 없으면 실수로 넣은 종목을 지울 수 없습니다.
		   배열에서 값을 빼는 splice 메소드를 사용합니다.
*/
</script>
