<!--
================================================================================
 파일명   : 2_exchange.html
 주제     : $.getJSON 으로 환율 데이터를 받아 계산기 만들기
 대상     : 비전공자 (자바스크립트를 처음 배우는 상태)
================================================================================

 이 파일에서 배우는 것
 ==========================================================================
 1. $.getJSON 문법과 $.ajax 와의 관계
 2. .fail() 로 실패를 처리하는 방법
 3. 응답이 "객체" 로 올 때 값을 꺼내는 방법
 4. 점 표기법과 대괄호 표기법의 차이
 5. 서버에서 받은 데이터를 저장해 두고 재사용하는 방법
 6. 입력칸의 값을 숫자로 바꿔 계산하는 방법


 참고. 1번 예제와 결정적으로 다른 점
 ==========================================================================

   [1번 예제 응답]   대괄호로 시작하는 배열

       [ {...}, {...}, {...} ]

       꺼내는 법   :  data[0].trade_price
       반복하는 법 :  $.each(배열, function(인덱스, 값){ })


   [2번 예제 응답]   중괄호로 시작하는 객체

       { "rates" : { "KRW":1361, "JPY":159 } }

       꺼내는 법   :  data.rates.KRW
       반복하는 법 :  $.each(객체, function(키, 값){ })

   중요. 배열은 "순서" 로 꺼내고, 객체는 "이름" 으로 꺼냅니다.
        이 두 가지만 알면 실무의 어떤 JSON 이 와도 값을 꺼낼 수 있습니다.


 참고. 이 화면의 전체 동작 순서
 ==========================================================================

   [브라우저]  2_exchange.html
       |
       | (1) 화면이 다 그려지면 환율 데이터를 딱 한 번 요청
       |     https://open.er-api.com/v6/latest/USD
       V
   [환율 서버]
       |
       | (2) 미국 달러 기준으로 160개가 넘는 나라의 환율 응답
       V
   [브라우저]
       |
       | (3) 받은 환율을 전역 변수에 저장 (이후 서버를 다시 부르지 않음)
       | (4) 선택상자 2개를 통화 목록으로 채움
       | (5) 금액을 입력하면 저장해 둔 값으로 즉시 계산해서 표시
       |
       | 금액을 바꿀 때마다 (5)번만 반복. 서버 요청은 없음

   중요. 계산할 때마다 서버를 다시 부르지 않습니다.
        환율은 하루에 한 번만 갱신되므로 매번 요청할 이유가 없습니다.
        한 번 받아 둔 데이터를 재사용하는 것이 실무 방식입니다.

   참고. 1번 예제는 왜 5초마다 다시 불렀는가
        코인 시세는 1초 단위로 계속 바뀌기 때문입니다.
        "데이터가 얼마나 자주 바뀌는가" 에 따라 요청 방식이 달라집니다.
-->

<!DOCTYPE html>
<!-- 위 한 줄은 "이 문서는 HTML5 문법으로 작성했다" 고 브라우저에게 알려주는 선언입니다. -->

<html>
<head>
<!-- meta charset="UTF-8"
     이 문서에 적힌 한글이 깨지지 않도록 문자 저장 방식을 지정합니다.
     이 한 줄이 없으면 "대한민국 원" 같은 글자가 모두 깨져 보입니다. -->
<meta charset="UTF-8">

<title>2. 환율 계산기</title>

	<!--
		jQuery 문법을 사용하기 위해 jQuery 파일을 먼저 불러옵니다.

		중요. 이 줄이 없으면 아래에서 $ 를 쓰는 모든 코드가
		      "$ is not defined" 라는 오류를 내고 아무것도 동작하지 않습니다.

		중요. 이 줄은 반드시 $ 를 사용하는 코드보다 "위" 에 있어야 합니다.
	-->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<style type="text/css">
		/*
			아래는 화면을 보기 좋게 꾸미는 부분입니다.
			통신 동작과는 관계가 없으므로 처음에는 넘어가도 됩니다.
		*/
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2      { color:#1d5fa8; }
		.box    { background:#fff; border:1px solid #cbd5e2; border-radius:8px;
		          padding:20px; max-width:660px; }
		.row    { margin-bottom:12px; }
		label   { display:inline-block; width:80px; font-weight:bold; font-size:14px; }

		/* text-align:right 는 금액을 오른쪽 정렬합니다.
		   숫자는 오른쪽 정렬해야 자리수를 비교하기 쉽습니다. */
		input   { padding:7px; border:1px solid #93a5bd; border-radius:4px; width:180px;
		          text-align:right; font-size:15px; }

		select  { padding:7px; border:1px solid #93a5bd; border-radius:4px; width:200px; }
		button  { background:#1d5fa8; color:#fff; border:none; padding:7px 14px;
		          border-radius:6px; cursor:pointer; font-size:13px; }

		#result { margin-top:16px; padding:18px; background:#e8f0fb; border-radius:8px;
		          text-align:center; }

		/* 아래 두 클래스는 자바스크립트가 만든 태그에 붙여 사용합니다. */
		.big    { font-size:30px; font-weight:bold; color:#0f1c2e; }
		.small  { font-size:13px; color:#4a6280; margin-top:6px; }

		table   { border-collapse:collapse; width:100%; margin-top:16px; }
		th,td   { border:1px solid #cbd5e2; padding:8px; font-size:14px; text-align:right; }
		th      { background:#e8f0fb; color:#1d5fa8; text-align:center; }

		/* td.c 는 "class 가 c 인 td 태그" 라는 뜻입니다. 통화 이름 칸만 가운데 정렬합니다. */
		td.c    { text-align:center; }

		.err    { color:#c0392b; font-weight:bold; }
		.note   { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
</head>
<body>

<h2>2. $.getJSON == 환율 계산기</h2>

<div class="box">

	<div class="row">
		<label>금액</label>
		<!--
			type="number" 로 지정하면
			  1) 숫자만 입력할 수 있습니다. (글자를 쳐도 들어가지 않습니다)
			  2) 칸 오른쪽에 위아래 화살표가 생깁니다.

			값을 꺼낼 때는 일반 input 과 똑같이 .val() 을 사용합니다.

			주의. type 이 number 여도 .val() 이 돌려주는 값은 "글자" 입니다.
			      계산에 쓰려면 반드시 숫자로 변환해야 합니다. (아래 4.1 참고)
		-->
		<input type="number" id="amount" value="100">
	</div>

	<div class="row">
		<label>보내는 돈</label>
		<!--
			id="from" : 자바스크립트가 이 선택상자를 찾을 때 쓰는 이름표입니다.
			지금은 안쪽에 option 이 하나뿐이지만,
			환율 데이터를 받으면 자바스크립트가 통화 목록으로 통째로 교체합니다.
		-->
		<select id="from"><option>불러오는 중...</option></select>
		<button id="swapBtn">서로 바꾸기</button>
	</div>

	<div class="row">
		<label>받는 돈</label>
		<select id="to"><option>불러오는 중...</option></select>
	</div>

	<!--
		계산 결과가 이 div 안쪽에만 표시됩니다.
		페이지 전체가 새로 그려지지 않고 이 부분만 바뀝니다.
	-->
	<div id="result">환율 데이터를 불러오는 중입니다...</div>

	<!-- 주요 통화 시세표가 이 div 안쪽에 채워집니다. -->
	<div id="table"></div>

	<p class="note">금액이나 통화를 바꾸면 서버를 다시 부르지 않고 즉시 계산됩니다.
	   한 번 받아 둔 데이터를 재사용하기 때문입니다.</p>
</div>

<script type="text/javascript">

	//===================================================================
	//0. 화면 전체에서 함께 쓰는 변수 선언 (전역 변수)
	//===================================================================
	/*
		참고. 전역 변수란 무엇인가

			함수 바깥에 선언한 변수를 전역 변수라고 부릅니다.
			이 파일 안의 어느 함수에서든 읽고 쓸 수 있습니다.

			함수 안에 선언하면 그 함수가 끝나는 순간 값이 사라집니다.
			여러 함수가 같은 값을 함께 봐야 할 때만 바깥에 선언합니다.

			여기서는 환율불러오기, 계산, 시세표그리기, 선택상자채우기
			네 함수가 모두 환율표를 봐야 하므로 바깥에 선언했습니다.
	*/

	//0.1 서버에서 받은 환율을 저장해 둘 객체입니다.
	//
	//    중괄호 { } 는 "이름 : 값" 짝을 담는 객체를 뜻합니다.
	//    처음에는 비어 있고, 데이터를 받으면 아래처럼 채워집니다.
	//
	//      { "USD":1, "KRW":1361.13, "JPY":159.08, "EUR":0.86, ..... }
	//
	//    let 을 쓴 이유는 나중에 통째로 다른 값으로 교체하기 때문입니다.
	let 환율표 = {};

	//0.2 많이 쓰는 통화만 골라 선택상자에 넣기 위한 목록입니다.
	//
	//    서버는 160개가 넘는 통화를 보내 줍니다.
	//    전부 넣으면 학생이 원하는 것을 찾기 어렵습니다.
	//
	//    const 를 쓴 이유는 이 목록을 프로그램 도중에 바꾸지 않기 때문입니다.
	//
	//    구조 :  "통화코드" : "한글 이름"
	//    통화코드는 국제 표준(ISO 4217)으로 정해진 3글자 영문입니다.
	const 주요통화 = {
		"USD" : "미국 달러",
		"KRW" : "대한민국 원",
		"JPY" : "일본 엔",
		"EUR" : "유로",
		"CNY" : "중국 위안",
		"GBP" : "영국 파운드",
		"AUD" : "호주 달러",
		"CAD" : "캐나다 달러",
		"HKD" : "홍콩 달러",
		"VND" : "베트남 동",
		"THB" : "태국 바트",
		"TWD" : "대만 달러"
	};


	//===================================================================
	//1. 화면이 준비되면 실행되는 부분
	//===================================================================
	/*
		참고. $(function(){ ... }) 문법의 정확한 의미

			"HTML 문서를 브라우저가 다 읽고 나면 이 안의 코드를 실행하라" 는 뜻입니다.

			아래 두 가지는 완전히 같은 뜻입니다.
			  $(document).ready(function(){ ... });     원래 표기
			  $(function(){ ... });                      줄임 표기

		참고. 왜 이렇게 감싸야 하는가

			브라우저는 HTML 을 위에서 아래로 순서대로 읽습니다.
			script 가 화면 태그보다 위에 있으면
			$("#from") 을 찾는 순간 그 태그는 아직 만들어지지 않은 상태입니다.

			그러면 아무 태그도 못 찾고, 오류도 나지 않은 채
			조용히 아무 일도 일어나지 않습니다. 원인을 찾기 매우 어렵습니다.
	*/
	$(function(){

		//환율 데이터를 딱 한 번 불러옵니다.
		//1번 예제처럼 setInterval 로 반복하지 않습니다.
		환율불러오기();
	});


	//===================================================================
	//2. 환율 데이터 불러오기
	//===================================================================
	function 환율불러오기(){

		/*
			참고. $.getJSON( url, 성공콜백 ) 문법

			     아래 $.ajax 코드와 완전히 같습니다.

			         $.ajax({
			             url : "https://open.er-api.com/v6/latest/USD",
			             type : "get",
			             dataType : "json",
			             success : function(response){ ... }
			         });

			     GET 방식으로 JSON 만 받아올 때는 이 축약형이 훨씬 짧습니다.
			     type 과 dataType 을 적지 않아도 자동으로 정해지기 때문입니다.

			참고. $.getJSON 의 매개변수 3가지

			     $.getJSON( url, data, callback )

			       url      : 요청할 주소
			       data     : 서버로 보낼 요청 데이터 (필요 없으면 생략 가능)
			       callback : 성공했을 때 실행할 콜백함수

			     여기서는 보낼 데이터가 없으므로 두 번째 인자를 생략했습니다.

			주의. $.getJSON 에는 error 를 넣을 자리가 없습니다.
			     그래서 뒤에 .fail() 을 붙여서 실패 처리를 합니다.

			참고. 콜백함수란
			     내가 직접 호출하지 않고, 특정 상황이 되면
			     시스템이 대신 호출해 주는 함수를 말합니다.
		*/
		$.getJSON("https://open.er-api.com/v6/latest/USD", function(response){

			/*
				response 로 받은 데이터의 실제 모습 (중괄호로 시작하는 객체입니다)

				{
				  "result"               : "success",
				  "base_code"            : "USD",
				  "time_last_update_utc" : "Thu, 03 Sep 2026 00:02:31 +0000",
				  "rates" : {                          값이 또 객체입니다
				      "USD" : 1,
				      "KRW" : 1361.139243,
				      "JPY" : 159.088772,
				      "EUR" : 0.863349,
				      .....
				  }
				}

				중요. 모든 값은 "미국 달러 1 을 기준" 으로 한 값입니다.
				     KRW 가 1361 이라는 것은 1달러가 1361원이라는 뜻입니다.
				     JPY 가 159 라는 것은 1달러가 159엔이라는 뜻입니다.

				주의. rates 안에 통화가 160개 넘게 들어 있습니다.
				     객체 안에 객체가 들어 있는 구조이므로
				     점을 두 번 찍어 꺼냅니다.

				         response.rates.KRW    ->  1361.139243
				         response.rates        ->  객체 전체
				         response.result       ->  "success"

				주의. dataType 이 자동으로 json 이므로
				     이미 자바스크립트 객체로 변환된 상태로 넘어옵니다.
				     글자가 아니므로 JSON.parse 를 따로 호출할 필요가 없습니다.
			*/

			//---------------------------------------------------------------
			//2.1 서버가 실패를 알려 준 경우를 먼저 검사합니다.
			//---------------------------------------------------------------
			//   통신은 성공했지만(상태코드 200) 데이터가 정상이 아닐 수 있습니다.
			//   이 서버는 정상이면 result 값이 "success" 로 옵니다.
			//
			//   !== 는 "같지 않다" 는 뜻입니다.
			//   === 와 !== 는 값과 자료형을 모두 비교합니다.
			//   (== 와 != 는 자료형을 무시하므로 실무에서는 쓰지 않습니다)
			//
			//   return 은 "이 함수를 여기서 즉시 끝내라" 는 뜻입니다.
			//   아래 코드는 실행되지 않습니다.
			if(response.result !== "success"){
				$("#result").html('<p class="err">환율 데이터가 정상이 아닙니다.</p>');
				return;
			}

			//---------------------------------------------------------------
			//2.2 환율을 전역 변수에 저장해 둡니다.
			//---------------------------------------------------------------
			//   이후 계산할 때마다 서버를 다시 부르지 않고 이 값을 재사용합니다.
			//
			//   중요. 이 한 줄이 이 예제의 핵심입니다.
			//        금액을 100번 바꿔도 서버 요청은 처음 1번뿐입니다.
			//
			//   중요. rates 객체만 저장합니다.
			//        result, base_code 같은 나머지 값은 계산에 쓰지 않기 때문입니다.
			환율표 = response.rates;

			//2.3 선택상자 2개를 통화 목록으로 채웁니다.
			선택상자채우기();

			//---------------------------------------------------------------
			//2.4 처음 값을 100달러에서 원화로 지정해 둡니다.
			//---------------------------------------------------------------
			//   .val("값") 은 선택상자에서 그 value 를 가진 option 을 선택합니다.
			//
			//   이 줄이 없으면 목록의 맨 위 항목이 자동 선택되어
			//   "미국 달러 -> 미국 달러" 처럼 의미 없는 계산이 처음 화면에 나옵니다.
			$("#from").val("USD");
			$("#to").val("KRW");

			//---------------------------------------------------------------
			//2.5 갱신 시각을 화면에 몰래 저장해 둡니다.
			//---------------------------------------------------------------
			/*
				참고. .attr("이름", "값") 메소드

					태그에 속성을 붙이거나 읽습니다.

						.attr("data-time", "값")   ->  속성을 붙입니다 (쓰기)
						.attr("data-time")          ->  속성 값을 읽습니다 (읽기)

					괄호 안에 값을 하나만 주면 읽기, 두 개를 주면 쓰기입니다.

				참고. data- 로 시작하는 속성

					HTML 에서 개발자가 마음대로 만들어 쓸 수 있는 속성입니다.
					화면에는 보이지 않고 값만 보관하는 용도로 사용합니다.
					data- 로 시작하지 않으면 브라우저가 무시하거나 오류를 낼 수 있습니다.

				참고. substring(시작, 끝)

					글자의 일부를 잘라냅니다. 끝 위치는 포함하지 않습니다.

						"Thu, 03 Sep 2026 00:02:31 +0000".substring(0, 16)
						  ->  "Thu, 03 Sep 2026"

					시각까지는 필요 없으므로 날짜 부분만 남깁니다.
			*/
			$("#result").attr("data-time", response.time_last_update_utc.substring(0, 16));

			//2.6 첫 계산을 실행합니다.
			//    이 줄이 없으면 사용자가 금액을 바꿀 때까지 결과가 비어 있습니다.
			계산();

			//2.7 주요 통화 시세표를 그립니다.
			시세표그리기();
		})
		//===============================================================
		// .fail() : 통신에 실패했을 때 실행되는 부분
		//===============================================================
		/*
			참고. 점을 찍어 이어 쓸 수 있는 이유

				$.getJSON 은 실행이 끝나면 자기 자신을 다시 돌려줍니다.
				그래서 그 뒤에 점을 찍어 .fail() 을 이어 붙일 수 있습니다.
				이런 방식을 메소드 체인이라고 부릅니다.

			참고. 위 콜백함수의 닫는 괄호가 } 가 아니라 }) 인 이유

				function(){ ... }  를 닫는 중괄호와
				$.getJSON( ... )   를 닫는 소괄호가 함께 오기 때문입니다.
				세미콜론은 .fail() 까지 다 이어 붙인 맨 끝에 한 번만 찍습니다.

			참고. 실패하는 경우
				인터넷이 끊김 / 서버가 죽음 / 404 / 500 / 요청 횟수 초과
		*/
		.fail(function(xhttp){
			//xhttp.status 에 상태코드가 들어 있습니다.
			//  404 : 주소가 잘못됨
			//  429 : 요청 횟수 초과
			//  500 : 서버 내부 오류
			//  0   : 인터넷 연결 자체가 안 됨
			$("#result").html('<p class="err">환율을 불러오지 못했습니다. (상태코드 '
			                  + xhttp.status + ')</p>');
		});
	}


	//===================================================================
	//3. 선택상자 채우기
	//===================================================================
	function 선택상자채우기(){

		//3.1 화면에 넣을 option 태그들을 누적할 변수입니다.
		//    let 을 쓰는 이유는 반복문에서 계속 덧붙이기 때문입니다.
		let html = "";

		/*
			참고. 객체를 반복할 때의 $.each 문법 (매우 중요)

				배열을 반복할 때  : $.each(배열, function(인덱스, 값){ ... })
				객체를 반복할 때  : $.each(객체, function(키,     값){ ... })

				첫 번째 매개변수의 의미가 달라집니다.
				배열에서는 0, 1, 2 같은 번호가 넘어오고
				객체에서는 "이름(키)" 이 넘어옵니다.

				주요통화 = { "USD" : "미국 달러",  "KRW" : "대한민국 원" }
				             -----   -----------
				              키          값

				1회차 : 코드="USD", 이름="미국 달러"
				2회차 : 코드="KRW", 이름="대한민국 원"
		*/
		$.each(주요통화, function(코드, 이름){

			//3.2 환율표에 없는 통화는 건너뜁니다.
			/*
				참고. ! 기호와 undefined

					! 는 "반대" 라는 뜻입니다.

					환율표["XYZ"] 처럼 없는 키를 꺼내면
					undefined(아무것도 없음)가 나옵니다.

					자바스크립트는 undefined 를 거짓으로 취급하므로
					!환율표[코드] 는 "값이 없으면 참" 이 됩니다.

				참고. $.each 안에서의 return

					여기서의 return 은 함수를 끝내는 것이 아니라
					"이번 회차만 건너뛰고 다음 회차로 넘어가라" 는 뜻입니다.
					일반 반복문의 continue 와 같은 역할입니다.

				이 검사를 하지 않으면 그 통화를 선택했을 때
				계산 결과가 NaN(숫자가 아님)으로 나옵니다.
			*/
			if(!환율표[코드]) return;

			//3.3 option 태그 하나를 만들어 뒤에 덧붙입니다.
			//
			//    += 는 "기존 값 뒤에 덧붙여라" 는 뜻입니다.
			//    + 기호는 글자와 글자를 이어붙이는 역할입니다.
			//
			//    완성되는 태그의 모습
			//      <option value="KRW">대한민국 원 (KRW)</option>
			//                    ---  -------------------
			//                  실제 값     화면에 보이는 글자
			html += '<option value="' + 코드 + '">'
			      + 이름 + ' (' + 코드 + ')'
			      + '</option>';
		});

		//---------------------------------------------------------------
		//3.4 같은 목록을 두 선택상자에 모두 넣습니다.
		//---------------------------------------------------------------
		/*
			참고. .html() 과 .text() 의 차이

				.html("값")  -> 값을 HTML 태그로 해석해서 그려 줍니다.
				.text("값")  -> 값을 글자 그대로 보여 줍니다.

			여기서는 option 이라는 "태그" 를 만들어 넣는 것이므로
			반드시 .html() 을 써야 합니다.
			.text() 를 쓰면 <option value=... 라는 글자가 그대로 보입니다.
		*/
		$("#from").html(html);
		$("#to").html(html);
	}


	//===================================================================
	//4. 계산하기 (이 파일에서 가장 중요한 함수)
	//===================================================================
	function 계산(){

		//---------------------------------------------------------------
		//4.1 화면에서 값 3개를 꺼냅니다.
		//---------------------------------------------------------------
		/*
			참고. parseFloat 를 반드시 써야 하는 이유

				입력칸에서 .val() 로 꺼낸 값은 항상 "글자" 입니다.
				숫자처럼 보여도 사실은 "100" 이라는 글자입니다.

				변환하지 않으면 이런 문제가 생깁니다.

					"100" * 2   ->  200      곱하기는 우연히 동작합니다
					"100" + 2   ->  "1002"   더하기는 글자 이어붙이기가 됩니다

			참고. parseFloat 와 parseInt 의 차이

				parseFloat("3.14")  ->  3.14     소수점을 살립니다
				parseInt("3.14")    ->  3        소수점을 버립니다

				금액에는 소수점이 있을 수 있으므로 parseFloat 를 씁니다.
		*/
		const 금액   = parseFloat($("#amount").val());

		//선택상자의 .val() 은 선택된 option 의 value 값을 돌려줍니다.
		//화면에 보이는 "대한민국 원 (KRW)" 가 아니라 "KRW" 가 나옵니다.
		const 보내는 = $("#from").val();
		const 받는   = $("#to").val();

		//---------------------------------------------------------------
		//4.2 숫자가 아니면 계산하지 않습니다.
		//---------------------------------------------------------------
		/*
			참고. NaN 이란 무엇인가

				Not a Number 의 줄임말이며 "숫자가 아님" 을 뜻하는 값입니다.

				입력칸을 비우고 parseFloat("") 를 하면 NaN 이 나옵니다.
				NaN 으로 계산하면 결과도 전부 NaN 이 되어
				화면에 NaN 이라는 글자가 그대로 표시됩니다.

			참고. isNaN(값)

				"이 값이 숫자가 아닌가?" 를 검사해 true 또는 false 를 돌려줍니다.

				주의. NaN === NaN 은 false 입니다.
				     NaN 은 자기 자신과도 같지 않다는 특이한 성질이 있습니다.
				     그래서 반드시 isNaN 함수로 검사해야 합니다.
		*/
		if(isNaN(금액)){
			$("#result").html('<div class="small">금액을 입력하세요.</div>');
			return;
		}

		/*
			===============================================================
			 참고. 환율 계산 공식 (이 예제에서 가장 중요한 부분)
			===============================================================

				받아 온 값은 모두 "미국 달러 1 기준" 입니다.

					환율표["KRW"] = 1361.13   ->  1달러 = 1361.13원
					환율표["JPY"] = 159.08    ->  1달러 = 159.08엔

				그래서 달러가 아닌 통화끼리 바꾸려면 두 단계를 거칩니다.
				달러를 중간 다리로 삼는 것입니다.

				1단계. 보내는 돈을 달러로 바꾼다
				         달러금액 = 금액 / 환율표[보내는통화]

				2단계. 달러를 받는 돈으로 바꾼다
				         결과 = 달러금액 * 환율표[받는통화]


				계산 예시.  10000원을 엔으로 바꾸기

				  1단계 :  10000 / 1361.13  =  7.346 달러
				  2단계 :  7.346 * 159.08   =  1168.6 엔

				  원화 ==(나누기)==> 달러 ==(곱하기)==> 엔


				주의. 1단계는 나누기, 2단계는 곱하기입니다.
				     순서를 바꾸거나 연산자를 바꾸면 완전히 다른 값이 나옵니다.

				     기준이 되는 통화(달러)로 갈 때는 나누고,
				     기준에서 다른 통화로 갈 때는 곱한다고 기억하면 됩니다.


			===============================================================
			 참고. 대괄호 표기법을 쓰는 이유 (반드시 이해해야 하는 부분)
			===============================================================

				꺼낼 키 이름이 변수(보내는)에 담겨 있기 때문입니다.

					환율표.보내는     ->  틀림
					                     "보내는" 이라는 이름의 키를 찾습니다.
					                     그런 키는 없으므로 undefined 가 나옵니다.

					환율표[보내는]    ->  맞음
					                     변수 안에 든 "KRW" 라는 키를 찾습니다.

				정리
					키 이름을 직접 알 때        ->  환율표.KRW      (점 표기법)
					키 이름이 변수에 있을 때    ->  환율표[보내는]   (대괄호 표기법)
		*/

		//4.3 1단계 == 보내는 돈을 달러로 환산
		const 달러금액 = 금액 / 환율표[보내는];

		//4.4 2단계 == 달러를 받는 통화로 환산
		const 결과 = 달러금액 * 환율표[받는];

		//4.5 1단위당 환율도 함께 계산합니다.
		//
		//    "1 USD = 1,361 KRW" 처럼 보여 주기 위한 값입니다.
		//    금액과 관계없이 통화끼리의 비율만 구하면 되므로
		//    두 환율을 그대로 나누면 됩니다.
		const 단위환율 = 환율표[받는] / 환율표[보내는];

		//---------------------------------------------------------------
		//4.6 화면에 표시할 HTML 만들기
		//---------------------------------------------------------------
		/*
			참고. 백틱(`) 문자열

				키보드에서 숫자 1 왼쪽에 있는 기호입니다.
				백틱으로 감싸면
				  1) 여러 줄에 걸쳐 문자열을 쓸 수 있습니다.
				  2) ${변수} 형태로 값을 그대로 끼워 넣을 수 있습니다.

				작은따옴표로 같은 코드를 쓰면 아래처럼 복잡해집니다.
				  '<div class="big">' + 결과 + ' ' + 받는 + '</div>'

			참고. toLocaleString 의 옵션

				toLocaleString(undefined, { maximumFractionDigits : 2 })

				  첫 번째 인자 : 어느 나라 형식으로 쓸지. undefined 는 "이 컴퓨터 기본값"
				  두 번째 인자 : 세부 설정을 담은 객체

				  maximumFractionDigits : 소수점 이하 최대 자리수
				  minimumFractionDigits : 소수점 이하 최소 자리수

				옵션을 주지 않으면 소수점 3자리에서 잘려 정확도가 떨어집니다.
				금액은 2자리, 환율은 4자리로 지정했습니다.

			참고. || 기호

				"또는" 이라는 뜻입니다.
				앞의 값이 없으면 뒤의 값을 대신 사용합니다.

				data-time 속성이 아직 없을 때 undefined 가 찍히는 것을 막습니다.
		*/
		const html = `
			<div class="small">${금액.toLocaleString()} ${보내는}</div>
			<div class="big">${결과.toLocaleString(undefined, {maximumFractionDigits:2})} ${받는}</div>
			<div class="small">
				1 ${보내는} = ${단위환율.toLocaleString(undefined, {maximumFractionDigits:4})} ${받는}
				&nbsp;|&nbsp; 기준일 ${$("#result").attr("data-time") || ""}
			</div>`;

		//4.7 결과 영역에만 넣습니다.
		//    페이지 전체가 새로 그려지지 않고 이 div 안쪽만 바뀝니다.
		$("#result").html(html);
	}


	//===================================================================
	//5. 주요 통화 시세표 그리기
	//===================================================================
	function 시세표그리기(){

		//5.1 표의 제목 줄을 먼저 만듭니다.
		//    th 는 표의 제목 칸, td 는 내용 칸입니다.
		//    제목 줄은 반복문 바깥에 있으므로 한 번만 만들어집니다.
		let html = '<table>';
		html += '<tr><th>통화</th><th>코드</th><th>1 USD 당</th><th>1,000원 당</th></tr>';

		//5.2 환율표 전체(160개)가 아니라 주요통화 목록(12개)만 반복합니다.
		//    보여 줄 것만 골라서 반복하는 것이 훨씬 효율적입니다.
		$.each(주요통화, function(코드, 이름){

			//환율표에 없는 통화는 건너뜁니다.
			if(!환율표[코드]) return;

			//5.3 1000원이 이 통화로 얼마인지 계산합니다.
			//
			//    계산 순서는 4.3, 4.4 와 완전히 같습니다.
			//      1000원 ==(나누기)==> 달러 ==(곱하기)==> 해당 통화
			//
			//    소괄호로 감싼 이유는 나누기를 먼저 하기 위해서입니다.
			//    (곱하기와 나누기는 우선순위가 같아 왼쪽부터 계산되므로
			//     사실 소괄호가 없어도 결과는 같지만, 의도를 분명히 하려고 넣었습니다)
			const 천원당 = (1000 / 환율표["KRW"]) * 환율표[코드];

			//5.4 표의 한 줄을 만들어 덧붙입니다.
			html += '<tr>';
			html += '  <td class="c">' + 이름 + '</td>';
			html += '  <td class="c">' + 코드 + '</td>';
			html += '  <td>' + 환율표[코드].toLocaleString(undefined, {maximumFractionDigits:4}) + '</td>';
			html += '  <td>' + 천원당.toLocaleString(undefined, {maximumFractionDigits:2}) + '</td>';
			html += '</tr>';
		});

		//반복문이 끝난 뒤 표를 닫습니다.
		html += '</table>';

		//5.5 표 영역에만 넣습니다.
		$("#table").html(html);
	}


	//===================================================================
	//6. 이벤트 등록
	//===================================================================
	/*
		참고. 자주 쓰는 이벤트 종류

			click   : 마우스로 클릭했을 때
			input   : 글자가 입력되거나 지워질 때마다 (한 글자마다 발생)
			change  : 선택 항목이 바뀌거나, 입력을 마치고 그 칸에서 벗어났을 때
			focus   : 그 칸에 커서가 들어왔을 때
			blur    : 그 칸에서 커서가 빠져나갔을 때
	*/

	//---------------------------------------------------------------
	//6.1 금액을 입력할 때마다 즉시 다시 계산합니다.
	//---------------------------------------------------------------
	/*
		참고. 함수 이름만 넘기는 방식

			$("#amount").on("input", 계산);
			                          ----
			                          소괄호를 붙이지 않습니다.

			  계산     ->  함수를 가리키기만 함. 나중에 실행하라고 넘기는 것
			  계산()   ->  지금 즉시 실행하고 그 결과를 넘기는 것 (틀림)

		참고. 여기서는 왜 디바운스를 쓰지 않았는가

			아이디 중복체크 예제에서는 글자마다 요청이 나가면
			서버에 부담이 되므로 디바운스를 걸었습니다.

			여기서는 서버를 부르는 것이 아니라
			이미 받아 둔 값으로 계산만 하므로
			아무리 자주 실행되어도 서버에 아무 부담이 없습니다.

			오히려 즉시 계산해 주는 것이 사용자에게 더 좋습니다.
	*/
	$("#amount").on("input", 계산);

	//---------------------------------------------------------------
	//6.2 선택상자를 바꾸면 다시 계산합니다.
	//---------------------------------------------------------------
	/*
		참고. 선택자에 콤마를 쓰면 여러 태그를 한 번에 고를 수 있습니다.

			"#from, #to"   ->  두 선택상자 모두에 이벤트를 겁니다.

			아래 두 줄을 한 줄로 줄인 것입니다.
			  $("#from").on("change", 계산);
			  $("#to").on("change", 계산);
	*/
	$("#from, #to").on("change", 계산);

	//---------------------------------------------------------------
	//6.3 서로 바꾸기 버튼
	//---------------------------------------------------------------
	$("#swapBtn").on("click", function(){

		/*
			참고. 두 값을 교환할 때 임시 변수가 반드시 필요한 이유

				임시 변수 없이 바로 덮어쓰면 이렇게 됩니다.

					from = to;      from 이 to 값으로 바뀜. 원래 from 값이 사라짐
					to = from;      이미 바뀐 값을 넣으므로 둘 다 같아짐

				그래서 원래 값을 잠깐 보관해 둘 변수가 필요합니다.

					1) 임시 <== from      원래 from 값을 보관
					2) from <== to        from 을 to 값으로 교체
					3) to   <== 임시      to 를 보관해 둔 값으로 교체
		*/

		//1) 현재 from 값을 임시로 보관합니다.
		const 임시 = $("#from").val();

		//2) from 을 to 값으로 바꿉니다.
		//   .val() 은 괄호가 비어 있으면 읽기, 값이 들어 있으면 쓰기입니다.
		$("#from").val($("#to").val());

		//3) to 를 보관해 둔 값으로 바꿉니다.
		$("#to").val(임시);

		//4) 바뀐 값으로 다시 계산합니다.
		//
		//   주의. .val() 로 값을 바꿔도 change 이벤트는 발생하지 않습니다.
		//        사용자가 직접 조작한 것이 아니기 때문입니다.
		//        그래서 계산() 을 직접 호출해야 합니다.
		//        이 줄이 없으면 선택상자만 바뀌고 결과는 그대로 남습니다.
		계산();
	});

/*
	=====================================================================
	 참고. 1번 예제와 2번 예제의 설계 비교
	=====================================================================

		                    1번 (코인)              2번 (환율)
		-----------------   --------------------    --------------------
		응답 형태           배열 [ {...} ]          객체 { "rates":{...} }
		값 꺼내기           data[0].trade_price     data.rates.KRW
		반복 문법           $.each(배열, (i, 값))   $.each(객체, (키, 값))
		서버 요청 횟수      5초마다 계속            처음 1번만
		이유                시세가 계속 바뀜        환율은 하루 1번 갱신
		사용 메소드         $.ajax                  $.getJSON + .fail


	=====================================================================
	 참고. 이 예제에서 꼭 기억할 3가지
	=====================================================================

		1. 서버 요청은 꼭 필요할 때만 합니다.
		   자주 바뀌지 않는 데이터는 받아서 저장해 두고 재사용합니다.
		   금액을 바꿀 때마다 요청하면 서버에 큰 부담이 됩니다.

		2. 객체에서 값을 꺼내는 방법이 두 가지입니다.
		   키 이름을 직접 알 때      ->  환율표.KRW
		   키 이름이 변수에 있을 때  ->  환율표[보내는]

		3. 입력칸의 값은 항상 글자입니다.
		   계산에 쓰기 전에 parseFloat 또는 parseInt 로 변환해야 합니다.
		   변환을 빠뜨리면 더하기가 글자 이어붙이기가 됩니다.


	=====================================================================
	 참고. 실무에서 이 코드에 더 추가하는 것들
	=====================================================================

		1. 통화 목록을 서버에서 관리
		   지금은 주요통화 12개를 코드에 직접 적었습니다.
		   실무에서는 DB 에 두고 관리자가 화면에서 수정할 수 있게 만듭니다.

		2. 데이터를 저장해 두고 재사용
		   화면을 새로고침하면 다시 요청하게 됩니다.
		   받은 시각과 함께 저장해 두고, 하루가 지나지 않았으면
		   그대로 쓰도록 만들면 요청 횟수를 크게 줄일 수 있습니다.

		3. 은행 고시 환율과의 차이 안내
		   실제 환전 시에는 수수료가 붙어 이 값과 다릅니다.
		   금융 관련 화면에는 반드시 안내 문구를 넣습니다.
*/
</script>
