<!--
================================================================================
 파일명   : FetchAjax/4.html
 주제     : 여러 요청을 동시에 보내기 (Promise.all)
 대상     : 비전공자
================================================================================

 이 파일에서 배우는 것
 --------------------------------------------------------------------------
 1. await 를 연달아 쓰면 왜 느려지는지
 2. Promise.all 로 요청을 동시에 출발시키는 방법
 3. 구조 분해 할당 문법  const [a, b, c] = 배열
 4. Date.now() 로 걸린 시간을 재는 방법
 5. Promise.all / allSettled / race 의 차이

 참고. 순차 실행과 동시 실행 비교 (시간 그림)
 --------------------------------------------------------------------------

   [순차 실행]  await 를 세 번 연달아 사용

     0초        1초        2초        3초
     |--회원정보--|--게시글---|--댓글----|

     -> 총 3초 걸림
     -> 앞의 요청이 끝나야 다음 요청이 출발함


   [동시 실행]  Promise.all 사용

     0초        1초
     |--회원정보--|
     |--게시글---|
     |--댓글----|

     -> 총 1초 걸림
     -> 세 요청이 동시에 출발함
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>fetch 로 여러 요청을 동시에 보내는 4.html 화면</title>

	<style type="text/css">
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2      { color:#1d5fa8; }
		.box    { background:#fff; border:1px solid #cbd5e2; border-radius:8px; padding:20px; max-width:680px; }
		button  { background:#1d5fa8; color:#fff; border:none; padding:9px 20px;
		          border-radius:6px; cursor:pointer; font-size:14px; margin-right:8px; }
		button:disabled { background:#8fa2bb; cursor:not-allowed; }
		/* white-space:pre-wrap 은 줄바꿈 문자(\n)를 실제 줄바꿈으로 보여 주는 설정입니다.
		   이 설정이 없으면 로그가 한 줄로 길게 이어져 보입니다. */
		#log    { margin-top:14px; padding:12px; background:#0f1c2e; color:#8ff0b6;
		          border-radius:6px; min-height:100px; font-family:monospace; font-size:13px;
		          white-space:pre-wrap; }
		.note   { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
</head>
<body>

<h2>4. fetch + Promise.all — 여러 요청을 동시에 보내기</h2>

<div class="box">
	<!-- 자바스크립트 함수 이름에는 한글도 사용할 수 있습니다.
	     실무에서는 영어로 쓰지만 수업에서는 이해를 돕기 위해 한글로 지었습니다. -->
	<button id="seqBtn" onclick="순차실행()">순차 실행 (느림)</button>
	<button id="allBtn" onclick="동시실행()">동시 실행 (빠름)</button>

	<!-- 진행 과정을 한 줄씩 출력할 영역입니다. -->
	<div id="log">버튼을 눌러 걸린 시간을 비교해 보세요.</div>

	<p class="note">서버가 각각 1초씩 걸리는 요청 3개를 보냅니다.
	   순차 실행은 약 3초, 동시 실행은 약 1초가 걸립니다.</p>
</div>

<script type="text/javascript">

	//==========================================================
	//준비 1. 브라우저 화면에 로그를 한 줄씩 추가하는 함수
	//==========================================================
	// += 는 "기존 값 뒤에 덧붙여라" 는 뜻입니다.
	//   a = a + b   와   a += b   는 같은 뜻입니다.
	//
	// "\n" 은 줄바꿈을 의미하는 특수 문자입니다.
	//   엔터를 친 것과 같은 효과를 냅니다.
	function log(text){
		document.getElementById("log").textContent += text + "\n";
	}
	//=========================================================================================
    //준비 2. 로그 영역 <div id="log">버튼을 눌러 걸린 시간을 비교해 보세요.</div> 의 컨텐츠 영역을 비우는 함수 
    //========================================================================================
	function clearLog(){
		document.getElementById("log").textContent = "";
	}
	//============================================================
	//준비3. 요청 하나를 보내는 공통 함수 
	//============================================================
	//매개변수 2개를 받습니다.
	// name : 어떤 요청 데이터인지 구분할 이름(회원정보, 게시글, 댓글)
	// sec  : 톰캣 서버가 몇 초 동안 일하는 척할지 
	//
	// 이 함수는 async 이므로 결과를 Promise 상자에 담아 반환합니다.
	// 이 성질 덕분에 아래 Promise.all 에 그대로 넣을 수 있습니다.
	async function callApi(name, sec){

		// slow.jsp 는 sec 초만큼 일부러 늦게 응답하는 실습용 서버 페이지입니다.
		const res = await fetch(`slow.jsp?name=${encodeURIComponent(name)}&sec=${sec}`);

		// if 문의 실행할 코드가 한 줄뿐이면 중괄호 { } 를 생략할 수 있습니다.
		if(!res.ok) throw new Error(`요청 실패 (${res.status})`);

		return await res.json();
	}
    
	/*
		======================================================
	    방법1. 순차 실행 
		=======================================================		
		참고. await 를 연달아 쓰면 앞의 요청이 끝나야 다음 요청이 시작됩니다.

		0초        1초        2초        3초
		|--회원정보--|--게시글---|--댓글----|

		-> 총 3초가 걸립니다.
		-> 앞의 결과가 뒤 요청에 꼭 필요한 경우가 아니라면 시간 낭비입니다.
	*/
	async function 순차실행(){
		
		clearLog();//이전 로그 지우기 
		
		//작업 시작 시각 기록
		//
		//  Date.now() 는 1970년 1월 1일부터 지금까지 흐른 시간을
		//  밀리초(1/1000초) 숫자로 돌려줍니다.
		//  예 : 1756900000000
		//
		//  시작 시각과 끝난 시각의 차이를 구하면 걸린 시간을 알 수 있습니다.
		const start = Date.now();
		log("순차 실행 시작");
		
		try{
			//1. 첫번째 요청이 끝날때 까지 기다림(약 1초)
			const a = await callApi("회원정보", 1);
			log("   " + a.name + " 완료");
			
			//2. 첫번째 요청이 완전히 끝난 뒤에야 두번 째 요청이 출발(약 1초 더)
			const b = await callApi("게시글", 1);
			log("   " + b.name + " 완료");
			
			//3. 두번쨰 작업이 끝난 뒤에야 세번째 요청이 출발(약 1초 더)
			const c = await callApi("댓글", 1);
			log("    " + c.name + " 완료");
			
			//4. 세 작업에 걸린 시간 계산해서 출력
			//
			//   Date.now() - start   -> 흐른 밀리초 (예 : 3012)
			//   / 1000               -> 초 단위로 변환 (예 : 3.012)
			//   .toFixed(1)          -> 소수점 첫째 자리까지만 남김 (예 : "3.0")
			log("총 걸린 시간 : " + ((Date.now() - start) / 1000).toFixed(1) + "초");
				
		}catch(err){
			//err.message 에는 throw new Error("....")로 넣었던 문구가 들어 있습니다.
			log("오류 발생 : " + err.message);
		}
	}

		/*
		=====================================================================
		 방법 2. 동시 실행 (Promise.all)
		=====================================================================

		참고. Promise.all 은 배열에 담은 요청들을 모두 동시에 출발시킵니다.

			0초        1초
			|--회원정보--|
			|--게시글---|
			|--댓글----|

			-> 총 1초면 끝납니다.
			-> 서로 관계없는 요청이라면 반드시 이 방식을 사용합니다.

		참고. 동시 실행이 가능한 원리

			callApi("회원정보", 1) 을 호출하는 순간
			요청은 이미 출발합니다. (await 를 붙이지 않아도 출발합니다)

			await 는 "출발시켜라" 가 아니라 "결과를 기다려라" 라는 뜻입니다.

			따라서 셋을 먼저 다 출발시켜 놓고
			마지막에 Promise.all 로 한꺼번에 기다리면 시간이 겹쳐 줄어듭니다.

		참고. 구조 분해 할당 문법

			const [a, b, c] = await Promise.all([...]);

			-> 결과 배열의 0번, 1번, 2번 값을 각각 a, b, c 변수에 한 번에 담습니다.

			-> 아래 코드와 완전히 같은 뜻입니다.

				const 결과 = await Promise.all([...]);
				const a = 결과[0];
				const b = 결과[1];
				const c = 결과[2];

			-> 결과는 "먼저 끝난 순서" 가 아니라 "배열에 넣은 순서" 대로 담깁니다.
	*/
	async function 동시실행(){

		clearLog();

		const start = Date.now();
		log("동시 실행 시작");

		try {
			//1. 세 요청을 배열에 담아 한꺼번에 출발시킴
			//
			//   대괄호 [ ] 는 여러 값을 순서대로 담는 배열을 의미합니다.
			//   Promise.all 은 배열 안의 모든 요청이 끝날 때까지 기다렸다가
			//   결과들을 다시 배열로 묶어서 돌려줍니다.
			const [a, b, c] = await Promise.all([
													callApi("회원정보", 1),
													callApi("게시글", 1),
													callApi("댓글", 1)
												]);

			log("  " + a.name + " 완료");
			log("  " + b.name + " 완료");
			log("  " + c.name + " 완료");

			//순차 실행은 약 3.0초, 동시 실행은 약 1.0초가 출력됩니다.
			log("총 걸린 시간 : " + ((Date.now() - start) / 1000).toFixed(1) + "초");

		} catch (err) {
			//주의. Promise.all 은 셋 중 하나라도 실패하면 전체가 실패로 처리됩니다.
			//     성공한 것만이라도 받고 싶다면 Promise.allSettled 를 사용합니다.
			log("오류 발생 : " + err.message);
		}
	}

/*
	참고. Promise 관련 메소드 3가지 비교

		Promise.all
		  - 전부 성공해야 성공합니다.
		  - 하나라도 실패하면 전체가 catch 로 넘어갑니다.
		  - 셋 다 반드시 있어야 화면을 그릴 수 있을 때 사용합니다.

		Promise.allSettled
		  - 실패한 것이 있어도 나머지 결과를 모두 받습니다.
		  - 각 결과에 status 값이 "fulfilled" 또는 "rejected" 로 담겨 옵니다.
		  - 일부가 실패해도 화면을 그릴 수 있을 때 사용합니다.

		Promise.race
		  - 가장 먼저 끝난 하나의 결과만 사용합니다.
		  - 여러 서버 중 빠른 쪽의 답만 쓰고 싶을 때 사용합니다.

	참고. 순차 실행을 반드시 써야 하는 경우

		앞의 결과가 뒤 요청에 꼭 필요한 경우에는 순차 실행이 맞습니다.

			const user  = await callApi("로그인");
			const board = await callApi("글목록?userNo=" + user.no);
			                                              ^^^^^^^ 앞의 결과가 필요함

		이런 관계가 없다면 무조건 동시 실행이 유리합니다.
*/
</script>

</body>
</html>
