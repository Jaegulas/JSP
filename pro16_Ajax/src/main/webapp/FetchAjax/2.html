<!--
================================================================================
 파일명   : FetchAjax/2.html
 주제     : fetch 로 아이디 중복체크 하기 (실무 표준 형태)
 대상     : 비전공자
================================================================================

 이 파일에서 배우는 것
 --------------------------------------------------------------------------
 1. 공통 요청 함수를 만들어 재사용하는 방법
 2. AbortController 로 요청에 시간 제한(타임아웃)을 거는 방법
 3. 디바운스로 불필요한 요청을 줄이는 방법
 4. 삼항 연산자 ( 조건 ? 참일때 : 거짓일때 ) 문법

 참고. 이 화면의 동작 순서
 --------------------------------------------------------------------------

   [브라우저] 아이디 칸에 a 입력
       |
       | 400 밀리초 동안 추가 입력이 없는지 기다림
       |
       | (계속 타이핑하면 계속 취소되고 다시 400 밀리초를 셈)
       V
   [브라우저] 400 밀리초 동안 조용함 -> 그때 딱 1번 요청 전송
       |
       | idCheck.jsp?id=admin
       V
   [톰캣서버] idCheck.jsp
       |
       | 1초 동안 검사하는 척 대기
       | {"id":"admin", "exist":true} 응답
       V
   [브라우저] <span id="msg"> 영역에만 결과 문구 표시

   중요. 서버가 1초 동안 일하는 동안에도
        사용자는 비밀번호 칸과 이메일 칸에 계속 입력할 수 있습니다.
        화면이 전혀 멈추지 않습니다. 이것이 비동기 통신의 핵심 효과입니다.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>fetch 로 아이디 중복체크 하는 2.html 화면</title>

	<style type="text/css">
		body   { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2     { color:#1d5fa8; }
		.box   { background:#fff; border:1px solid #cbd5e2; border-radius:8px; padding:20px; max-width:660px; }
		.row   { margin-bottom:12px; }
		label  { display:inline-block; width:80px; font-weight:bold; }
		input  { padding:6px; border:1px solid #93a5bd; border-radius:4px; width:200px; }
		#msg   { margin-left:10px; font-weight:bold; }
		.note  { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
</head>
<body>

<h2>2. fetch + async/await — 아이디 중복체크 (실무 표준)</h2>

<div class="box">
	<div class="row">
		<label>아이디</label>

		<!-- id="id" : 자바스크립트가 이 입력칸을 찾을 때 사용할 이름표
		     placeholder : 아무것도 입력하지 않았을 때 회색으로 보이는 안내 문구 -->
		<input type="text" id="id" placeholder="admin, test, hong 은 중복">

		<!-- 검사 결과 문구가 표시될 자리입니다. 지금은 비어 있습니다. -->
		<span id="msg"></span>
	</div>

	<div class="row">
		<label>비밀번호</label>
		<!-- type="password" 로 지정하면 입력한 글자가 점(●)으로 가려집니다. -->
		<input type="password" id="pwd">
	</div>

	<div class="row">
		<label>이메일</label>
		<input type="text" id="email">
	</div>

	<p class="note">서버가 1초 동안 검사하는 사이에도 비밀번호와 이메일을 계속 입력할 수 있습니다.
	   이것이 비동기 통신의 핵심입니다.</p>
</div>

<script type="text/javascript">
/*
	참고. 이 파일에서 사용하는 실무 필수 기법 3가지

		1. 공통 요청 함수  : 프로젝트마다 하나만 만들어 모든 요청에서 재사용합니다.
		                    오류 처리 코드를 한 곳에서만 관리할 수 있습니다.

		2. 타임아웃        : 서버가 응답하지 않을 때 무한정 기다리지 않도록
		                    일정 시간이 지나면 요청을 강제로 취소합니다.

		3. 디바운스        : 글자를 칠 때마다 요청이 나가지 않도록
		                    마지막 입력 후 잠시 조용할 때만 요청을 보냅니다.
*/

	//=====================================================================
	// 1. 공통 요청 함수
	//=====================================================================
	/*
		참고. 매개변수에 = {} 를 붙인 이유 (기본값 문법)

			async function callApi(url, options = {})

			options 를 넘기지 않고 호출하면 자동으로 빈 객체 {} 가 들어갑니다.

				callApi("idCheck.jsp?id=hong")          -> options 는 {}
				callApi("save.jsp", {method:"POST"})    -> options 는 {method:"POST"}

			이 문법이 없으면 options 가 undefined 가 되어 아래에서 오류가 납니다.
	*/
	async function callApi(url, options = {}){

		/*
			참고. AbortController 를 쓰는 이유

				fetch 에는 "몇 초 안에 응답이 없으면 포기한다" 는 옵션이 없습니다.
				서버가 멈춰 있으면 사용자는 영원히 기다리게 됩니다.

				AbortController 는 진행 중인 요청을 강제로 취소할 수 있는 장치입니다.
				controller.abort() 를 호출하는 순간 fetch 가 즉시 취소되고
				catch 블록으로 넘어갑니다.
		*/

		//1.1 요청 취소용 제어 객체 생성
		//    new 는 "새로 하나 만들어라" 는 뜻의 명령어입니다.
		const controller = new AbortController();

		//1.2 8초가 지나면 요청을 강제로 취소하도록 예약
		//
		//    setTimeout(실행할함수, 밀리초)
		//      -> 지정한 시간이 지난 뒤에 함수를 딱 한 번 실행합니다.
		//      -> 1000 밀리초 = 1초 이므로 8000 은 8초입니다.
		//
		//    () => controller.abort()
		//      -> 화살표 함수 문법입니다. function(){ controller.abort(); } 와 같은 뜻입니다.
		//      -> "8초 뒤에 이 동작을 하라" 고 미리 등록해 두는 것입니다.
		//
		//    setTimeout 은 예약 번호(숫자)를 반환합니다.
		//    나중에 그 예약을 취소하려면 이 번호가 필요하므로 timer 에 저장합니다.
		const timer = setTimeout(() => controller.abort(), 8000);

		try {
			//1.3 요청 보내기
			//
			//    fetch(주소, 옵션객체) 형태로 두 번째 인자에 설정을 넘길 수 있습니다.
			const res = await fetch(url, {

				//signal : 위에서 만든 제어 장치를 이 요청에 연결합니다.
				//         이 줄이 있어야 controller.abort() 가 이 요청에 효력을 가집니다.
				signal : controller.signal,

				//... 은 "펼침 연산자(스프레드)" 입니다.
				//호출한 쪽에서 넘긴 옵션들을 이 자리에 그대로 펼쳐 넣습니다.
				//
				//  예 : options 가 { method:"POST", body:"..." } 라면
				//       위 객체는 { signal:..., method:"POST", body:"..." } 가 됩니다.
				...options
			});

			//1.4 상태 검사
			//    fetch 는 404, 500 에서도 예외를 던지지 않으므로 반드시 직접 검사합니다.
			if(!res.ok){
				throw new Error(`요청 실패 (${res.status})`);
			}

			//1.5 응답 본문이 아예 없는 경우(상태코드 204)를 대비
			//    === 는 "값과 자료형이 모두 같은가" 를 검사하는 비교 연산자입니다.
			//    (== 는 자료형을 무시하고 비교하므로 실무에서는 === 를 사용합니다)
			//    본문이 없는데 res.json() 을 호출하면 오류가 나므로 빈 객체를 반환합니다.
			if(res.status === 204) return {};

			//1.6 JSON 으로 변환해서 호출한 쪽에 돌려주기
			//    return 은 "이 값을 함수를 부른 쪽으로 돌려준다" 는 명령입니다.
			return await res.json();

		} finally {
			//1.7 성공이든 실패든 반드시 예약해 둔 타이머를 정리
			//
			//    clearTimeout(예약번호) -> 등록해 둔 setTimeout 예약을 취소합니다.
			//
			//    정리하지 않으면 요청이 1초 만에 끝났는데도
			//    8초 뒤에 이미 끝난 요청을 취소하려고 시도하게 됩니다.
			//    이런 코드를 "메모리 누수" 라고 부릅니다.
			clearTimeout(timer);
		}
	}

	//=====================================================================
	// 2. 아이디 중복체크 함수
	//=====================================================================
	async function checkId(){

		//2.1 입력한 아이디를 얻어 앞뒤 공백 제거
		//    .trim() -> "  admin  " 을 "admin" 으로 바꿔 줍니다.
		//               사용자가 실수로 넣은 공백 때문에 중복 검사가 틀리는 것을 막습니다.
		const id = document.getElementById("id").value.trim();

		//결과 문구를 표시할 span 태그를 미리 찾아서 변수에 담아 둡니다.
		//같은 태그를 여러 번 찾지 않아도 되므로 코드가 짧아집니다.
		const msg = document.getElementById("msg");

		//2.2 빈 값이면 서버를 부르지 않는다
		//    return 은 "이 함수를 여기서 즉시 끝내라" 는 뜻입니다. (아래 코드는 실행 안 됨)
		//    불필요한 요청을 줄이는 기본 습관입니다.
		if(id === ""){
			msg.textContent = "";
			return;
		}

		//2.3 검사 중임을 화면에 표시
		//    통신에는 시간이 걸리므로 아무 표시가 없으면
		//    사용자는 화면이 고장 났다고 생각합니다.
		//
		//    .style.color = "색" -> 그 태그의 글자 색을 바꿉니다.
		msg.textContent = "확인 중...";
		msg.style.color = "#6b7c93";

		try {
			//2.4 위에서 만든 공통 요청 함수 호출
			//    서버가 { "id":"admin", "exist":true } 형태의 객체를 돌려줍니다.
			//    callApi 안에서 이미 res.json() 까지 처리했으므로
			//    여기서는 바로 객체를 받습니다.
			const data = await callApi(`idCheck.jsp?id=${encodeURIComponent(id)}`);

			/*
				참고. 삼항 연산자 문법

					조건식 ? 참일때값 : 거짓일때값

					아래 코드는 if 문으로 쓰면 이것과 같습니다.

						if(data.exist){
							msg.textContent = "이미 사용중입니다";
						}else{
							msg.textContent = "사용 가능합니다";
						}

					data.exist 에는 true 또는 false 가 들어 있습니다.
					true  -> 그 아이디가 이미 존재함
					false -> 사용 가능함
			*/

			//2.5 화면 전체가 아니라 msg 부분만 갱신
			msg.textContent = data.exist ? "이미 사용중입니다" : "사용 가능합니다";
			msg.style.color = data.exist ? "red" : "green";

		} catch (err) {
			//2.6 통신 실패, 타임아웃, 서버 오류가 모두 여기로 넘어옵니다.
			//    공통 함수 안에서 throw 한 오류도 여기서 잡힙니다.
			msg.textContent = "확인 중 오류가 발생했습니다";
			msg.style.color = "red";
			console.error(err);
		}
	}

	//=====================================================================
	// 3. 디바운스
	//=====================================================================
	/*
		참고. 디바운스가 필요한 이유

			디바운스가 없을 때 "admin" 이라고 입력하면
			a, ad, adm, admi, admin  ->  요청이 5번 발생합니다.

			사용자가 100명이면 요청이 500번 발생해 서버가 견디지 못합니다.

			디바운스를 적용하면
			마지막 글자 입력 후 400밀리초 동안 조용할 때 요청이 1번만 발생합니다.

		참고. 디바운스의 원리 (시간 흐름 그림)

			a 입력      -> 400 밀리초 예약
			d 입력      -> 이전 예약 취소, 400 밀리초 다시 예약
			m 입력      -> 이전 예약 취소, 400 밀리초 다시 예약
			i 입력      -> 이전 예약 취소, 400 밀리초 다시 예약
			n 입력      -> 이전 예약 취소, 400 밀리초 다시 예약
			(400 밀리초 조용) -> 이때 딱 1번 실행
	*/

	//3.0 예약 번호를 저장할 변수 선언
	//    let 은 나중에 값이 계속 바뀌는 변수를 만들 때 사용합니다.
	//    (예약할 때마다 새 번호가 들어오므로 const 를 쓸 수 없습니다)
	let timerId;

	//3.1 아이디 입력칸에 "input" 이벤트를 등록
	//
	//    addEventListener("이벤트이름", 실행할함수)
	//      -> "이 태그에서 이런 일이 벌어지면 이 함수를 실행하라" 고 등록합니다.
	//
	//    이벤트 종류
	//      click  : 마우스로 클릭했을 때
	//      input  : 글자가 입력되거나 지워질 때마다 (한 글자마다 발생)
	//      change : 입력을 마치고 그 칸에서 벗어났을 때
	//      submit : 폼을 전송할 때
	document.getElementById("id").addEventListener("input", () => {

		//3.2 이전에 예약해 둔 요청을 취소
		//    아직 실행되지 않은 예약만 취소되므로 안전합니다.
		clearTimeout(timerId);

		//3.3 400밀리초 뒤에 checkId 함수를 실행하도록 다시 예약
		//
		//    주의. setTimeout(checkId, 400)   <- 소괄호를 붙이지 않습니다.
		//          setTimeout(checkId(), 400) <- 이렇게 쓰면 지금 즉시 실행되어 버립니다.
		timerId = setTimeout(checkId, 400);
	});
</script>

</body>
</html>
