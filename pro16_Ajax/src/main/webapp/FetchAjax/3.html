<!--
================================================================================
 파일명   : FetchAjax/3.html
 주제     : fetch 로 POST 방식 데이터 보내기 + 중복 클릭 방지
 대상     : 비전공자
================================================================================

 이 파일에서 배우는 것
 --------------------------------------------------------------------------
 1. GET 방식과 POST 방식의 차이
 2. fetch 의 두 번째 인자(옵션 객체)에 method, headers, body 를 넣는 방법
 3. JSON.stringify() 로 객체를 문자열로 바꾸는 이유
 4. 버튼을 잠가 같은 요청이 여러 번 나가는 사고를 막는 방법
 5. finally 블록에 뒷정리 코드를 쓰는 이유

 참고. 이 화면의 동작 순서
 --------------------------------------------------------------------------

   [브라우저] 3.html
       |
       | (1) [저장] 버튼 클릭
       | (2) 버튼을 잠금 (disabled = true) -> 연타해도 요청이 안 나감
       | (3) 입력값을 객체로 만들고 JSON 문자열로 변환
       | (4) POST 방식으로 save.jsp 에 본문(body) 에 담아 전송
       V
   [톰캣서버] save.jsp
       |
       | (5) request.getReader() 로 본문 전체를 읽음
       | (6) 1초 대기 (저장하는 척)
       | (7) {"success":true, "received":{...}} 응답
       V
   [브라우저] 3.html
       |
       | (8) 결과를 <div id="result"> 에만 표시
       | (9) finally 에서 버튼 잠금 해제
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>fetch 로 POST 전송하는 3.html 화면</title>

	<style type="text/css">
		body     { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2       { color:#1d5fa8; }
		.box     { background:#fff; border:1px solid #cbd5e2; border-radius:8px; padding:20px; max-width:660px; }
		.row     { margin-bottom:12px; }
		label    { display:inline-block; width:60px; font-weight:bold; vertical-align:top; }
		input, textarea { padding:6px; border:1px solid #93a5bd; border-radius:4px; width:400px; }
		textarea { height:70px; }
		button   { background:#1d5fa8; color:#fff; border:none; padding:9px 20px;
		           border-radius:6px; cursor:pointer; font-size:14px; }
		/* button:disabled -> 버튼이 잠긴 상태일 때만 적용되는 스타일입니다.
		   색이 회색으로 변해 사용자가 "지금은 누를 수 없다" 는 것을 눈으로 알 수 있습니다. */
		button:disabled { background:#8fa2bb; cursor:not-allowed; }
		#result  { margin-top:14px; padding:12px; background:#e8f0fb; border-radius:6px;
		           color:#1d5fa8; min-height:22px; word-break:break-all; }
		.note    { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
</head>
<body>

<h2>3. fetch + async/await — POST로 데이터 보내기</h2>

<div class="box">
	<div class="row">
		<label>제목</label>
		<input type="text" id="title" value="첫 번째 글입니다">
	</div>

	<div class="row">
		<label>내용</label>
		<!-- textarea 는 여러 줄을 입력할 수 있는 큰 입력칸입니다.
		     input 과 달리 value 속성이 아니라 태그 사이에 기본값을 씁니다.
		     값을 꺼낼 때는 input 과 똑같이 .value 를 사용합니다. -->
		<textarea id="content">fetch로 POST 전송하는 예제입니다.</textarea>
	</div>

	<!-- id="saveBtn" : 자바스크립트가 이 버튼을 잠그기 위해 찾아낼 이름표입니다. -->
	<button id="saveBtn" onclick="save()">저장</button>

	<div id="result"></div>

	<p class="note">저장 버튼을 연타해 보세요. 처리 중에는 버튼이 잠겨
	   같은 글이 여러 번 저장되는 사고를 막습니다.</p>
</div>

<script type="text/javascript">
/*
	참고. GET 방식과 POST 방식의 차이 (반드시 외워야 하는 내용)

		GET
		  - 주소 뒤에 ? 를 붙여 값을 전달합니다.
		      calc.jsp?v1=10&v2=20
		  - 값이 주소창에 그대로 보입니다.
		    따라서 비밀번호나 주민번호를 보내면 절대 안 됩니다.
		  - 길이 제한이 있습니다. (브라우저마다 다르지만 약 2KB)
		  - 주로 "조회" 할 때 사용합니다. (목록 보기, 검색, 중복체크)

		POST
		  - 요청 본문(body) 이라는 보이지 않는 공간에 값을 담아 전달합니다.
		  - 주소창에 보이지 않고 길이 제한도 사실상 없습니다.
		  - 주로 "저장, 수정, 삭제" 할 때 사용합니다.
		    (글 등록, 회원가입, 로그인, 파일 업로드)

		그림으로 비교

		  GET   요청 :  주소  save.jsp?title=제목&content=내용
		                본문  (비어 있음)

		  POST  요청 :  주소  save.jsp
		                본문  {"title":"제목","content":"내용"}
*/
	//==================================================================
	//저장 함수
	//=================================================================
	async function save(){
	
		//함수 안에서 여러번 사용할 태그를 미리 찾아(선택해) 변수에 담아 둡니다.
		const btn = document.getElementById("saveBtn");   //1.<button id="saveBtn" onclick="save()">저장</button>		
		const result = document.getElementById("result"); //2.<div id="result"></div>
		
		//1. 중복으로 저장 버튼 클릭 방지 하기 위해  <button id="saveBtn">저장</button>의 disabled 속성값이 true 경우 save() 즉시 종료
		if(btn.disabled) return;
		
		//2. 저장 버튼을 즉시 잠그고 처리 중임을 표시
		btn.dsiabled = true;   			//disabled = true  -> 버튼을 눌러도 아무 반응이 없게 됩니다.
		btn.textContent = "저장 중...";	//저장 -> 저장 중...으로 버튼 글자 변경
		result.textContent = "";        //<div id="result">""</div>
		
		try{ //3. 브라우저 화면에서 입력한 값을 얻어 자바스크립트 {} 객체로 만들기
			const data = {  title : document.getElementById("title").value, 
				          content : document.getElementById("content").value };
			
			//4. POST 방식으로 요청 보내기
			//   fetch함수의 두번째 인자에 옵션 객체를 넘겨 요청방식과 요청데이터를 지정합니다.
			const res = await fetch("save.jsp",{
							
				method : "POST", //4.1. 요청 방식을 POST로 지정
				
				//                           application/json   -> 요청 메세지의 BODY본문에  요청데이터가 JSON 문자열이다
				headers : {"Content-Type" : "application/json"},//4.2. 요청을 보내는 데이터의 형식을 톰캣서버에 알림
				
				body : JSON.stringify(data)  //4.3. 실제 요청 보낼 데이터 설정
				
			});
			
			//5. 상태 검사 (fetch함수는 404, 500 에서도 예외를 던지지 않으므로 필수)
			if(!res.ok){
				throw new Error(`저장 실패 (${res.status})`);
			}
			
			//6. 응답받은 `{"success":true, "received":<%=jsonBody% >}` 문자열--객체로 변환-> {"success":true, "received":<%=jsonBody% >}
			const json = await res.json();
			
			//7. 결과를 화면의 <div id="result"></div> 사이에 응답 데이터를 보여주자
			result.textContent = "저장 성공. 서버가 받은 데이터 : " + JSON.stringify(json.received);

		}catch(err){
			//요청 통신 실패, 서버 오류가 모두 여기로 넘어옵니다.
			result.textContent = "저장에 실패 했습니다.";
		}finally{
			//8. 요청 성공 하든 실패 하든 저장 버튼을 원래대로 되돌림(활성화 시켜 버튼이 클릭되게 하자)
			btn.disabled = false;
			btn.textContent = "저장";
		}
		
	}


/*
	참고. 기존 JSP 서블릿을 고치지 않고 POST 를 보내는 방법

		위 방식은 JSON 문자열을 보내므로
		서버에서 request.getParameter("title") 로 읽을 수 없습니다.
		request.getReader() 로 본문 전체를 직접 읽어야 합니다.

		기존 서블릿의 getParameter() 를 그대로 쓰고 싶다면
		아래처럼 "폼 형식" 으로 보내면 됩니다.

			await fetch("save.jsp", {
				method : "POST",
				headers : { "Content-Type" : "application/x-www-form-urlencoded;charset=UTF-8" },
				body : new URLSearchParams({ title:"제목", content:"내용" })
			});

		URLSearchParams 는 객체를 title=제목&content=내용 형태의 문자열로 바꿔 줍니다.
		이렇게 보내면 서버에서 request.getParameter("title") 로 바로 읽을 수 있습니다.

		정리
			새로 만드는 프로젝트          -> JSON 방식 (위 코드)
			기존 서블릿을 그대로 쓸 때    -> URLSearchParams 방식
*/
</script>

</body>
</html>
