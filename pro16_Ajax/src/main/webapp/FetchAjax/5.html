<!--
================================================================================
 파일명   : FetchAjax/5.html
 주제     : JSON 배열을 받아 화면에 반복 출력하기 (map + join + 백틱)
 대상     : 비전공자
================================================================================

 이 파일에서 배우는 것
 --------------------------------------------------------------------------
 1. JSON 파일(ex1.json)을 fetch 로 읽어오는 방법
 2. 배열과 객체가 섞인 데이터의 구조를 읽는 방법
 3. map() 으로 배열을 반복 처리하는 방법
 4. join("") 으로 배열을 하나의 문자열로 합치는 방법
 5. innerHTML 과 textContent 의 차이

 참고. ex1.json 파일의 구조
 --------------------------------------------------------------------------

   [                                  <- 대괄호 : 배열(목록)의 시작
     {                                <- 중괄호 : 객체(하나의 단어 카드)
       "term"       : "BACCHUS. 바쿠스",
       "part"       : "명사.",
       "definition" : "고대인들이 ...",
       "quote"      : [ "꼴딱꼴딱...", "꿀꺽꿀꺽..." ],   <- 값이 또 배열임
       "author"     : "애주가"
     },
     {
       "term"       : "BACKBITE. 험담하다",
       "part"       : "동사.",
       "definition" : "상대방에게 ..."
                                      <- quote 와 author 가 없음. 반드시 확인 필요
     },
     .....
   ]

   중요. 첫 번째 객체에만 quote 와 author 가 있습니다.
        확인 없이 출력하면 나머지 카드에 undefined 라는 글자가 찍힙니다.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>fetch 로 JSON 배열을 반복 출력하는 5.html 화면</title>

	<style type="text/css">
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2      { color:#1d5fa8; }
		.box    { background:#fff; border:1px solid #cbd5e2; border-radius:8px; padding:20px; max-width:680px; }
		button  { background:#1d5fa8; color:#fff; border:none; padding:9px 20px;
		          border-radius:6px; cursor:pointer; font-size:14px; }
		.entry  { border-bottom:1px solid #e0e7f0; padding:10px 0; }
		.term   { color:#1d5fa8; margin:0 0 4px 0; font-size:15px; }
		.part   { color:#6b7c93; font-size:12px; font-style:italic; }
		.definition { margin:4px 0; }
		.quote  { color:#7a6a3a; font-size:13px; margin-left:12px; }
		.author { color:#6b7c93; font-size:12px; margin-left:12px; }
		.note   { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
</head>
<body>

<h2>5. fetch + async/await — JSON 배열을 반복 출력하기</h2>

<div class="box">
	<button onclick="loadDictionary()">단어 목록 불러오기</button>

	<!-- 만들어진 단어 카드들이 이 div 안쪽에 채워집니다. -->
	<div id="dictionary"></div>

	<p class="note">jQuery의 $.getJSON + $.each 를 fetch와 map으로 바꾼 예제입니다.
	   jQuery 없이 브라우저 기본 문법만 사용합니다.</p>
</div>

<script type="text/javascript">

	async function loadDictionary(){
		
		//응답 결과를 넣어 보여줄 위 <div id="dictionary"></div> 선택
		const area =  document.getElementById("dictionary");
		
		try{
			//1. "ex1.json" 으로 JSON 데이터 요청 후 응답 받기
			const res = await fetch("ex1.json");
			
			//2. 요청 상태 검사
			if(!res.ok){
				throw new Error(`요청 실패 (${res.status})`);
			}
			//3. 응답 메세지 본문영역의 응답내용을 자바스크립트 배열로 변환해서 저장
			// 변환된 모습
			//   [ {term:"...", part:"...", definition:"..."}, {...}, ..... ]
			const data = await res.json();
			/*
			   [                                       <- 대괄호 : 배열(목록)의 시작
				     {                                 <- 중괄호 : 객체(하나의 단어 카드)
				       "term"       : "BACCHUS. 바쿠스",
				       "part"       : "명사.",
				       "definition" : "고대인들이 ...",
				       "quote"      : [ "꼴딱꼴딱...", "꿀꺽꿀꺽..." ],   <- 값이 또 배열임
				       "author"     : "애주가"
				     },
				     {
				       "term"       : "BACKBITE. 험담하다",
				       "part"       : "동사.",
				       "definition" : "상대방에게 ..."
				                                      <- quote 와 author 가 없음. 반드시 확인 필요
				     },
				]
			*/
			//4. data 배열의 각 객체를 HTML 문자열로 바꾼 뒤 하나로 이어붙이기
			//
			//    entry.quote 는 값이 있으면 배열, 없으면 undefined 입니다.
			//    자바스크립트는 undefined 를 거짓(false) 으로 취급하므로
			//    삼항 연산자의 조건식에 그대로 넣을 수 있습니다.
			//
			//    확인하지 않으면 화면에 undefined 라는 글자가 그대로 출력됩니다.
			//
			//    안쪽의 map 은 quote 배열의 각 줄을 <div> 로 감싸는 역할입니다.
			//    (배열 안에 또 배열이 있으므로 반복이 두 겹입니다)
			const html = data.map(entry=>{
				
				//4.1. "quote"  가 있는 {} 객체만 인용문 부분을 만들고, 없으면 빈 문자열 
				const quoteHtml = entry.quote ? entry.quote.map(line => `<div class="quote">${line}</div>`).join("")
												                      + `<div class="author">- ${entry.author}</div>`
												: "";
											
				//4.2 객체 하나를 HTML 덩어리로 변환해서 반환
				//
				//    백틱(`) 으로 감싸면
				//      - 여러 줄에 걸쳐 문자열을 쓸 수 있습니다.
				//      - ${변수} 형태로 값을 그대로 끼워 넣을 수 있습니다.
				return `
						<div class="entry">
						<h3 class="term">${entry.term}</h3>
						<div class="part">${entry.part}</div>
						<div class="definition">${entry.definition}</div>
						${quoteHtml}
						</div>`;

																
			}).join(""); //map 함수가 만든 배열의 데이터들을 하나의 긴 문바열로 합칩니다.
				
			//5. 완성한 HTML 전체 문자열을  <div id="dictionary"></div> 선택 응답 결과로 넣어 보여줌
			area.innerHTML = html;
	
		}catch(err){
			//오류가 나면 안내 문구만 표시해서 보여 준다.
			area.textContent = "목록을 불러오지 못했습니다";
			console.log(err);
		}	
	}
</script>

</body>
</html>
