<!--
================================================================================
 파일명   : step1.html
 단계     : 1단계 - 좌표를 고정해서 날씨 조회하기
 대상     : 비전공자 (자바스크립트를 처음 배우는 상태)
================================================================================

 이 단계의 목표
 ==========================================================================
 좌표를 코드에 직접 적어 두고 서울의 현재 날씨를 화면에 표시합니다.
 도시 검색은 아직 하지 않습니다. 2단계에서 추가합니다.

 이 단계에서 배우는 것
 ==========================================================================
 1. fetch 로 서버에 요청을 보내는 방법
 2. async 와 await 의 정확한 의미
 3. try catch finally 로 오류를 처리하는 방법
 4. 응답 상태(res.ok)를 직접 검사해야 하는 이유
 5. 화면의 일부분만 바꾸는 방법


 참고. 이 화면의 동작 순서
 ==========================================================================

   [브라우저]  step1.html
       |
       | (1) 조회 버튼 클릭
       | (2) fetch 로 Open-Meteo 서버에 요청
       |     좌표는 코드에 적어 둔 서울 좌표를 그대로 사용
       V
   [Open-Meteo 서버]
       |
       | (3) 현재 날씨를 JSON 으로 응답
       V
   [브라우저]
       |
       | (4) 결과 영역 안쪽에만 기온과 습도를 표시
       | (5) 페이지 전체는 새로 그려지지 않음


 참고. 동기 통신과 비동기 통신의 차이
 ==========================================================================

   [동기 통신]  = 지금까지 배운 form 전송 방식

     화면A ==요청==> 서버 ==HTML문서 전체==> 화면B (완전히 새 화면)

     화면이 하얗게 변했다가 전체가 새로 그려집니다.
     주소창의 주소도 바뀝니다.


   [비동기 통신] = 이 파일이 사용하는 Ajax 방식

     화면A ==요청==> 서버 ==값(JSON)==> 화면A 의 결과 영역만 변경

     화면은 그대로 있고 날씨 부분만 바뀝니다.
     주소창의 주소가 바뀌지 않습니다.
-->

<!DOCTYPE html>
<!-- 위 한 줄은 "이 문서는 HTML5 문법으로 작성했다" 고 브라우저에게 알려주는 선언입니다. -->

<html>
<head>
<!-- meta charset="UTF-8"
     이 문서에 적힌 한글이 깨지지 않도록 문자 저장 방식을 지정합니다.
     이 한 줄이 없으면 화면의 한글이 모두 깨져 보입니다. -->
<meta charset="UTF-8">

<title>1단계 - 좌표로 날씨 조회하기</title>

	<!--
		중요. 이 파일에는 jQuery 를 불러오는 script 태그가 없습니다.

		fetch 는 브라우저에 기본으로 들어 있는 기능이라
		따로 무엇을 불러올 필요가 없습니다.

		jQuery 를 쓰려면 파일을 먼저 불러와야 했던 것과 다른 점입니다.
	-->

	<style type="text/css">
		/* 아래는 화면을 보기 좋게 꾸미는 부분입니다.
		   통신 동작과는 관계가 없으므로 처음에는 넘어가도 됩니다. */
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f4f7fb; }
		h2      { color:#1d5fa8; }
		.box    { background:#fff; border:1px solid #d5e0ec; border-radius:10px;
		          padding:22px; max-width:620px; }
		button  { background:#1d5fa8; color:#fff; border:none; padding:10px 20px;
		          border-radius:7px; cursor:pointer; font-size:14px; }

		/* button:disabled 는 버튼이 잠긴 상태일 때만 적용됩니다.
		   회색으로 변해 지금은 누를 수 없다는 것을 눈으로 알 수 있습니다. */
		button:disabled { background:#8fa2bb; cursor:not-allowed; }

		#result { margin-top:18px; padding:20px; background:#e8f0fb; border-radius:8px;
		          min-height:60px; }
		.temp   { font-size:44px; font-weight:bold; color:#0f1c2e; }
		.sub    { font-size:14px; color:#4a6280; margin-top:6px; }
		.err    { color:#c0392b; font-weight:bold; }
		.note   { color:#6b7c93; font-size:13px; margin-top:14px; }
		.nav    { margin-top:16px; font-size:14px; }
		.nav a  { color:#1d5fa8; font-weight:bold; text-decoration:none; margin-right:12px; }
	</style>
</head>
<body>

<h2>1단계 - 좌표를 고정해서 날씨 조회하기</h2>

<div class="box">

	<!--
		id="btn" : 이 버튼에 이름표를 붙였습니다.
		           자바스크립트가 이 이름표를 보고 버튼을 찾아냅니다.

		여기서는 onclick 속성을 쓰지 않았습니다.
		아래 스크립트에서 addEventListener 로 이벤트를 등록합니다.
		화면 태그와 동작 코드를 분리하는 것이 실무 권장 방식입니다.
	-->
	<button id="btn">서울 날씨 조회</button>

	<!--
		id="result"
		서버에서 받은 결과를 끼워 넣을 빈 그릇입니다.
		지금은 안내 문구만 있지만 자바스크립트가 내용을 교체합니다.

		중요. 페이지 전체가 아니라 이 div 안쪽만 바뀝니다.
		      이것이 비동기 통신(Ajax)의 핵심입니다.
	-->
	<div id="result">버튼을 눌러 보세요.</div>

	<p class="note">F12 를 눌러 Network 탭을 열어 두면
	   실제로 어떤 주소로 요청이 나가고 어떤 JSON 이 돌아오는지 볼 수 있습니다.</p>

	<div class="nav">
		<a href="index.html">처음으로</a>
		<a href="guide.html">자습서</a>
		<a href="step2.html">2단계로 넘어가기</a>
	</div>
</div>

</body>
</html>
