<!--
================================================================================
 파일명   : JQueryAjax/2.html
 주제     : jQuery $.ajax 로 json 형식의 응답 받기
 대상     : 비전공자
================================================================================

 참고. 1.html 과 2.html 의 차이

   1.html   요청 -> calc.jsp      응답 -> 30
                                        값이 하나뿐이라 무엇의 결과인지 알 수 없습니다.

   2.html   요청 -> calc2.jsp     응답 -> { "v1":10, "v2":20, "result":30 }
                                        이름표가 붙은 여러 값을 한 번에 받습니다.

   실무에서는 거의 항상 JSON 방식을 사용합니다.
   화면에 표시할 값이 하나뿐인 경우는 거의 없기 때문입니다.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>jQuery $.ajax 로  json 응답받는 2.html 화면</title>

	<!--
		jQuery 문법을 사용하기 위해 jQuery 파일을 먼저 불러옵니다.

		이 한 줄이 없으면 $ 를 사용하는 모든 코드에서
		"$ is not defined" 오류가 발생합니다.

		주의. 이 주소는 인터넷에 있는 파일이므로
		      인터넷이 끊긴 환경에서는 동작하지 않습니다.
		      실무에서는 파일을 다운로드해서 프로젝트 안에 넣어 두기도 합니다.
	-->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<style type="text/css">
		body   { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2     { color:#1d5fa8; }
		.box   { background:#fff; border:1px solid #cbd5e2; border-radius:8px; padding:20px; max-width:620px; }
		input  { padding:6px; border:1px solid #93a5bd; border-radius:4px; width:120px; }
		button { background:#1d5fa8; color:#fff; border:none; padding:8px 18px;
		         border-radius:6px; cursor:pointer; margin-top:8px; }
		#result{ margin-top:14px; padding:12px; background:#e8f0fb; border-radius:6px;
		         color:#1d5fa8; font-weight:bold; min-height:22px; }
		.note  { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
<body>

	<h2>2. JQuery  $.ajax()함수 - json 형식으로 응답받기</h2>

	<div class="box">		
		<!-- name 속성은 <form> 으로 전송할 때 쓰는 이름이고,
		     id 속성은 자바스크립트가 찾을 때 쓰는 이름표입니다.
		     Ajax 에서는 id 만 있으면 충분하지만 관례상 둘 다 적어 두었습니다. -->
		값1 입력 : <input type="text" name="v1" id="v1" value="10"> <br><br>
		값2 입력 : <input type="text" name="v2" id="v2" value="20"> <br>
		
		<button id="cal">계산요청</button>
	
		<!-- 계산결과가 표시될 영역 -->
		<div id="result"></div>
	
		<p class="note">1.html은 값 하나(text)만 응답 받았지만
					    2.html은 여러 값이 묶인 JSON 객체를 응답 받아 각각 값을 꺼내 사용합니다.</p>
	
	</div>
	
	<script type="text/javascript">
	//전체 흐름 : <input>태그 2개에 값을 입력한 뒤에 [계산요청] 버튼을 클릭하면
	//  		입력한 2개의 값을 요청 데이터로 설정하고 calc.jsp 로 AJAX 비동기 통신 요청합니다.
	//  		calc.jsp 에서 응답한 결과 데이터를 1.html 이 텍스트 형식으로 응답받고,
	//  		<div id="result"></div> 콘텐츠 영역에 넣어 보여줍니다.	
	
		//1. 계산요청 버튼을 선택해서 CLICK 이벤트 등록
		$("#cal").on("click", function(){
			
			//2. $.ajax 함수로 calc.jsp 톰캣서버페이지에 비동기 통신 요청
			$.ajax({
					 //요청 URL 설정
					 url : "calc2.jsp",
					 
					 //요청 전송방식 설정
					 type : "get",
					 
					 //톰캣서버가 실행하는 calc2.jsp 서버페이지로 요청할 데이터 설정
					 data : { v1:$("#v1").val(),  v2:$("#v2").val() },
					 
					 //calc2.jsp가 응답하는 예상 데이터 유형 설정
					 dataType : "json",
					 
					 //calc2.jsp로 요청 통신에 성공했을 때 호출되는 콜백함수 정의
					 success : function(response){
							/*
							response 매개변수로 전달받은 calc2.jsp 의 응답 모습

								{
									"v1" : 10,
									"v2" : 20,
									"result" : 30
								}
							*/
						 //JSONObject { ....... } 객체에서  각 값을 꺼내 조합해서 요청한 브라우저 화면에 응답(표시)
						 $("#result").text(response.v1 + " + " + response.v2 + " = " + response.result);
	
					 }
				   });
			
		});
		
/*	===================================================================================================
	참고 . JQuery 문법에서 제공하는  $.ajax() 함수 ??????
	==================================================================================================
		
		 GET, POST 같은 HTTP프로토콜 방식으로 서버페이지에 비동기 통신 요청을 보내고
		 JSON, XML, HTML, TEXT 형태의 데이터를 요청한 html로 응답받는 jQuery의 함수 입니다.
		
		 작성 문법
		 		
		 			$.ajax({
		 					  url : '요청할 서버페이지 주소',
		 					  
		 					  type : '요청방식',      			                     <- get, post, put, delete 중 하나 
		 				
		 					  data : '서버페이지에 보낼 요청데이터',   				 <- {} 객체 또는 문자열
		 					  
		 					  dataType : '서버페이지로 부터 응답받을 예상 데이터 유형',    <- json, xml, html, text 중 하나 
		 					  
		 					  success : function(response){   <- 서버페이지에 요청 통신에 성공했을때 자동 호출 콜백 function 설정
		 						  		    
		 						  	//response 로 응답 데이터를 받아 화면에 갱신하는 코드 작성  
		 					  },
		 					  
		 					  error : function(xhttp, status, error){   <- 서버페이지에 요청 통신에 실패했을때 자동 호출 콜백 function 설정   
		 						  
		 						  	//오류 안내 문구를 출력하는 코드 작성 
		 						  
		 					  },
		 					  
		 					  complete : function(){           <- 성공/실패 상관없이 항상 호출
		 						    
		 						    //뒷정리 코드 작성
		 					  }
		 					  
		 				   });
	
	
	
	
*/	
	</script>
	
	
	
	
	
	


</body>
</html>
