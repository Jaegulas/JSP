<!--
================================================================================
 파일명   : JQueryAjax/4.html
 주제     : jQuery $.ajax 로 아이디 중복체크 하기 (실전 예제)
 대상     : 비전공자
================================================================================

 이 파일에서 배우는 것
 --------------------------------------------------------------------------
 1. 버튼을 누르지 않아도 입력 도중에 자동으로 검사하는 방법
 2. input 이벤트의 사용법
 3. 디바운스로 요청 횟수를 줄이는 방법
 4. 메소드 체인 문법  $("#msg").text("...").css("color", "red")

 참고. 이 화면의 동작 순서

   [브라우저] 아이디 칸에 글자 입력
       |
       | input 이벤트 발생 (한 글자마다 발생)
       | 이전 예약을 취소하고 400 밀리초 뒤에 실행하도록 다시 예약
       |
       | (계속 타이핑하면 계속 취소되고 다시 예약됨)
       V
   [브라우저] 400 밀리초 동안 조용함 -> checkId() 실행
       |
       | idCheck.jsp?id=admin
       V
   [톰캣서버] idCheck.jsp
       |
       | 1초 대기 후 {"id":"admin","exist":true} 응답
       V
   [브라우저] <span id="msg"> 영역에만 결과 표시

   중요. 서버가 1초 동안 검사하는 동안에도
        비밀번호 칸과 이메일 칸에 계속 입력할 수 있습니다.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>jQuery $.ajax 로 아이디 중복체크 하는 4.html 화면</title>

	<!-- jQuery 문법 사용을 위한 파일 불러오기 -->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<style type="text/css">
		body   { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2     { color:#1d5fa8; }
		.box   { background:#fff; border:1px solid #cbd5e2; border-radius:8px; padding:20px; max-width:620px; }
		.row   { margin-bottom:12px; }
		label  { display:inline-block; width:80px; font-weight:bold; }
		input  { padding:6px; border:1px solid #93a5bd; border-radius:4px; width:180px; }
		#msg   { margin-left:10px; font-weight:bold; }
		.note  { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
</head>
<body>

<h2>4. jQuery $.ajax — 아이디 중복체크 (실전 예제)</h2>

<div class="box">
	<div class="row">
		<label>아이디</label>
		<input type="text" id="id" placeholder="admin, test, hong 은 중복">

		<!-- 검사 결과 문구가 표시될 자리 -->
		<span id="msg"></span>
	</div>

	<div class="row">
		<label>비밀번호</label>
		<input type="password" id="pwd">
	</div>

	<div class="row">
		<label>이메일</label>
		<input type="text" id="email">
	</div>

	<p class="note">아이디를 입력하는 도중에 자동으로 서버에 검사를 요청합니다.
	                버튼을 누르지 않아도 실행되며, 검사하는 1초 동안에도 비밀번호와 이메일을 계속 입력할 수 있습니다.</p>
</div>

<script type="text/javascript">

	//1. 디바이운스용 예약 번호를 저장할 변수 선언
	let timerId;
		  
	//2. 아이디 <input>입력칸에 input 이벤트 등록
	$("#id").on("input", function(){
		
		//2.1. 이전에 예약해 둔 요청을 취소
		//     아직 실행되지 않은 예약만 취소되므로 안전합니다.
		clearTimeout(timerId);
		
		//2.2. 400밀리초 뒤에 checkId 함수를 실행하도록 다시 예약
		//
		// 글자를 계속 치는 동안에는 2.1. 에서 계속 취소 되므로 타이핑 중에는 요청이 전혀 나가지 않습니다.
		//
		// 주의. setTimeout(checkId, 400);  <-  checkId 함수 이름만 씁니다.
		//      setTimeout(checkId(), 400) <- 소괄호를 붙이면 지금 즉시 실행됩니다.
		timerId = setTimeout(checkId, 400);
			
	});
	//3. 실제 아이디 중복 체크 요청을 서버페이지로 보내는 함수
	function checkId(){
					
		//3.1. 입력한 아이디를 얻어 앞뒤 공백 제거 
		const id = $("#id").val().trim();
		
		
		//3.2. 아이디를 입력하지 않아 빈 값이면 톰캣 서버가 실행하는 "idCheck.jsp"를 요청하지 못하도록 함수 즉시 종료
		if(id === ""){
			$("#msg").text("");
			return;
		}
		//3.3. 검사 중임을 화면 표시 
		$("#msg").text("확인 중...").css("color", "#6b7c93");
		
		//4. idCheck.jsp 서버 페이지로 AJAX 비동기 통신 요청
		$.ajax({
				url : "idCheck.jsp", //요청할 서버페이지 주소 설정		
				type : "get",        //요청 전송 방식 (아이디 조회요청이므로 get)
				data : { id : id },   //요청할 데이터를 "키 : 값" 형태읭 객체로 설정
				dataType : "json",   //서버페이지가 JSON 을 응답하므로 json으로 지정합니다.
				success : function(response){ //요청 통신에 성공시 자동으로 호출되는 콜백 함수 정의					
					/* 
					response 매개변수로 전달받은 idCheck.jsp 의 응답 모습

						{ "id" : "admin", "exist" : true }

					response.exist 에는 true 또는 false 가 들어 있습니다.
					  true  -> 그 아이디는 이미 사용중
					  false -> 사용 가능
					*/
					if(response.exist){
						$("#msg").text("이미 사용중인 아이디입니다").css("color","red");
					}else{
						$("#msg").text("사용 가능한 아이디입니다").css("color","green");
					}			
				},
				//요청 통신에 실패시 자동으로 호출되는 콜백 함수 정의
				//예 : 톰캣 서버가 꺼졌거나 404, 500 이 발생하면 여기로 넘어 옵니다.
				error : function(xhttp, status, error){
					$("#msg").text("확인 중 오류가 발생했습니다").css("color","red");
				}
		});
	} //-------> function checkId() 끝 

	

</script>

</body>
</html>


<!-- 


		참고. input 태그에  자주 쓰는 이벤트 종류

			click   : 마우스로 클릭했을 때
			input   : 글자가 입력되거나 지워질 때마다 (한 글자마다 발생)
			change  : 입력을 마치고 그 칸에서 벗어났을 때 한 번만 발생
			focus   : 그 칸에 커서가 들어왔을 때
			blur    : 그 칸에서 커서가 빠져나갔을 때
			keyup   : 키보드에서 손을 뗐을 때

		참고. keyup 대신 input 을 쓰는 이유

			keyup 은 키보드 입력만 감지합니다.
			마우스 오른쪽 클릭으로 붙여넣기 한 경우에는 발생하지 않습니다.
			input 은 값이 바뀌는 모든 경우에 발생하므로 더 안전합니다.
	
 -->
