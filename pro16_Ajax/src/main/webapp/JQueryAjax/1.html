<!--
================================================================================
 파일명   : JQueryAjax/1.html
 주제     : jQuery $.ajax 로 text 형식의 응답 받기
 대상     : 비전공자
================================================================================

 참고. jQuery 란 무엇인가

   자바스크립트를 더 짧게 쓸 수 있도록 만들어진 "도구 모음 파일" 입니다.
   2010년 전후에 만들어진 거의 모든 웹사이트가 이것을 사용했습니다.

   지금 실무에서 새로 만드는 프로젝트는 fetch 를 사용하지만,
   기존에 만들어진 JSP 프로젝트를 유지보수하려면 jQuery 를 반드시 읽을 줄 알아야 합니다.

 참고. 문법 비교

   [기본 자바스크립트]   document.getElementById("v1").value
   [jQuery]              $("#v1").val()

   [기본 자바스크립트]   document.getElementById("result").textContent = "값"
   [jQuery]              $("#result").text("값")

   $ 는 jQuery 라는 이름의 줄임말입니다.
   $("선택자") 형태로 화면의 태그를 찾아옵니다.

     $("#v1")     -> id 가 v1 인 태그 하나        (# 는 id 를 의미)
     $(".box")    -> class 가 box 인 태그 전부    (. 은 class 를 의미)
     $("div")     -> 모든 div 태그

 참고. 이 화면의 동작 순서

   [브라우저] 1.html
       |
       | (1) 값 10, 20 입력 후 [계산] 버튼 클릭
       | (2) $.ajax 로 calc.jsp?v1=10&v2=20 요청
       V
   [톰캣서버] calc.jsp
       |
       | (3) 30 이라는 값만 응답 (HTML 태그 없음)
       V
   [브라우저] 1.html
       |
       | (4) success 콜백함수가 자동 실행되며 response 에 30 이 담겨 옴
       | (5) <div id="result"> 영역에만 표시
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>jQuery $.ajax 로 text 응답받는 1.html 화면</title>

	<!--
		jQuery 문법을 사용하기 위해 jQuery 파일을 먼저 불러옵니다.

		이 한 줄이 없으면 $ 를 사용하는 모든 코드에서
		"$ is not defined" 오류가 발생합니다.

		주의. 이 주소는 인터넷에 있는 파일이므로
		      인터넷이 끊긴 환경에서는 동작하지 않습니다.
		      실무에서는 파일을 다운로드해서 프로젝트 안에 넣어 두기도 합니다.
	-->
	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<style type="text/css">
		body   { font-family:'Malgun Gothic'; padding:24px; background:#f7f9fc; }
		h2     { color:#1d5fa8; }
		.box   { background:#fff; border:1px solid #cbd5e2; border-radius:8px; padding:20px; max-width:620px; }
		input  { padding:6px; border:1px solid #93a5bd; border-radius:4px; width:120px; }
		button { background:#1d5fa8; color:#fff; border:none; padding:8px 18px;
		         border-radius:6px; cursor:pointer; margin-top:8px; }
		#result{ margin-top:14px; padding:12px; background:#e8f0fb; border-radius:6px;
		         color:#1d5fa8; font-weight:bold; min-height:22px; }
		.note  { color:#6b7c93; font-size:13px; margin-top:12px; }
	</style>
<body>

	<h2>1. JQuery  $.ajax()함수 - text 형식으로 응답받기</h2>

	<div class="box">		
		<!-- name 속성은 <form> 으로 전송할 때 쓰는 이름이고,
		     id 속성은 자바스크립트가 찾을 때 쓰는 이름표입니다.
		     Ajax 에서는 id 만 있으면 충분하지만 관례상 둘 다 적어 두었습니다. -->
		값1 입력 : <input type="text" name="v1" id="v1" value="10"> <br><br>
		값2 입력 : <input type="text" name="v2" id="v2" value="20"> <br>
		
		<button id="cal">계산요청</button>
	
		<!-- 계산결과가 표시될 영역 -->
		<div id="result"></div>
	
		<p class="note">계산요청 버튼을 눌러도 웹브라우저 화면이 새로 그려지지 않고 결과 데이터 영역만 바뀝니다.
						웹브라우저 주소창의 1.html을 처음 요청한 주소도 바뀌지 않습니다.</p>
	
	</div>
	
	<script type="text/javascript">
	//전체 흐름 : <input>태그 2개에 값을 입력한 뒤에 [계산요청] 버튼을 클릭하면
	//  		입력한 2개의 값을 요청 데이터로 설정하고 calc.jsp 로 AJAX 비동기 통신 요청합니다.
	//  		calc.jsp 에서 응답한 결과 데이터를 1.html 이 텍스트 형식으로 응답받고,
	//  		<div id="result"></div> 콘텐츠 영역에 넣어 보여줍니다.	
	
		//1. 계산요청 버튼을 선택해서 CLICK 이벤트 등록
		$("#cal").on("click", function(){
			
			//2. $.ajax 함수로 calc.jsp 톰캣서버페이지에 비동기 통신 요청
			$.ajax({
					  //2.1.요청할 서버페이지 주소 
					  //
					  //  "calc.jsp" 처럼 파일명만 쓰면 지금 1.html 문서와 같은 폴더에 calc.jsp가 위치해야 합니다.
					  //   실제 요청할 서버페이지 주소 는?
					  //    http://localhost:8181/pro16_Ajax/JQueryAjax/calc.jsp?v1=10&v2=20
					  url : "calc.jsp",
				
					  //2.2.요청 전송 방식 (get 또는 post)
					  //
					  // get : 요청값이  요청주소뒤에 ?v1=10&v2=20 형태로 붙습니다. 조회할때 사용 
					  // post : 요청값이  Http요청메세지 전체의 본문영역에 숨겨져서 요청전송됩니다.  저장/수정/삭제할때 사용
					  type : "get",
					  
					  //2.3.서버로 보낼 요청 데이터들  "key:value" 형태의 객체로 작성합니다.
		  			  //
					  //  $("#v1").val()  ->  id 가 v1 인 입력칸에 입력된 값을 꺼냅니다.
					  //                      기본 문법의 document.getElementById("v1").value 와 같습니다.
					  //
					  //  jQuery 가 이 객체를 자동으로 v1=10&v2=20 형태로 바꿔 주소 뒤에 붙여 줍니다.
					  //  encodeURIComponent 처리도 jQuery 가 알아서 해 줍니다.
					  data : { v1: $("#v1").val(),  v2: $("#v2").val() },
					  
					  //2.4.톰캣 서버가 실행하는 clac.jsp 브라우저로 응답할 것으로 예상하는 데이터 형식
					  //
					  //  text -> 일반 글자 (여기서 사용)
					  //  json -> JSON 데이터. jQuery 가 자동으로 객체로 변환해 줍니다.
					  //  html -> HTML 조각
					  //  xml  -> XML 문서
					  //
					  //  주의.  톰캣 서버가 실행하는 clac.jsp가 실제로 응답하는 형식과 일치시켜야 합니다.
					  //        서버는 JSON 을 주는데 text 로 지정하면 값을 꺼낼 수 없습니다.
					  dataType : "text",
					  
					  //2.5. 요청 통신에 성공했을때 JQuery가 자동으로 호출하는 콜백함수 정의
					  //
					  // 매개변수 response에  톰캣 서버가 실행하는 clac.jsp가 응답한 데이터가 담겨서 넘어 옵니다.
					  // => 여기서는 calc.jsp 가 out.print(30) 했으므로 response 는 "30" 입니다.  
					  success : function(response){
						  
						  console.log(response);   //F12 -> Console 탭에서 확인 가능 
						  
						  //응답 받은 데이터를 <div id="result"></div> 영역에 넣어 브라우저 화면에 보여줍니다.
						  $("#result").text("계산 결과 : " + response);
						  				  
					  },
					  //2.6. 요청 통신에 실패했을때 JQuery 가 자동으로 호출되는 콜백함수 정의
					  //
					  //  xhttp  : 통신에 사용된 XMLHttpRequest 객체 (상태코드가 여기 들어 있음)
					  //  status : 오류 상태를 나타내는 글자 ("error", "timeout" 등)
					  //  error  : 오류 메시지
					  error : function(xhttp, status, error) {
																  //404 , 500 ... 들 중에 하나  출력 
						   $("#result").text("요청에 실패했습니다 : " + xhttp.status);
					  },
					  
					  //2.7. 요청 통신에 성공 하든!  실패 하든! 요청이 끝나면 실행되는 콜백함수 정의
					  complete : function(){
						  console.log("요청완료");
					  }
					  
				
				   });
			
		});
		
/*	===================================================================================================
	참고 . JQuery 문법에서 제공하는  $.ajax() 함수 ??????
	==================================================================================================
		
		 GET, POST 같은 HTTP프로토콜 방식으로 서버페이지에 비동기 통신 요청을 보내고
		 JSON, XML, HTML, TEXT 형태의 데이터를 요청한 html로 응답받는 jQuery의 함수 입니다.
		
		 작성 문법
		 		
		 			$.ajax({
		 					  url : '요청할 서버페이지 주소',
		 					  
		 					  type : '요청방식',      			                     <- get, post, put, delete 중 하나 
		 				
		 					  data : '서버페이지에 보낼 요청데이터',   				 <- {} 객체 또는 문자열
		 					  
		 					  dataType : '서버페이지로 부터 응답받을 예상 데이터 유형',    <- json, xml, html, text 중 하나 
		 					  
		 					  success : function(response){   <- 서버페이지에 요청 통신에 성공했을때 자동 호출 콜백 function 설정
		 						  		    
		 						  	//response 로 응답 데이터를 받아 화면에 갱신하는 코드 작성  
		 					  },
		 					  
		 					  error : function(xhttp, status, error){   <- 서버페이지에 요청 통신에 실패했을때 자동 호출 콜백 function 설정   
		 						  
		 						  	//오류 안내 문구를 출력하는 코드 작성 
		 						  
		 					  },
		 					  
		 					  complete : function(){           <- 성공/실패 상관없이 항상 호출
		 						    
		 						    //뒷정리 코드 작성
		 					  }
		 					  
		 				   });
	
	
	
	
*/	
	</script>
	
	
	
	
	
	


</body>
</html>
