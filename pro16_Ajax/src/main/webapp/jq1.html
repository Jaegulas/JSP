<!--
================================================================================
 파일명   : jq1.html
 단계     : 1단계 jQuery 버전 - 좌표를 고정해서 날씨 조회하기
 짝 파일  : step1.html (fetch 버전)
 대상     : 비전공자
================================================================================

 이 파일의 목적
 ==========================================================================
 step1.html 과 화면도 동작도 완전히 같습니다. 문법만 jQuery 로 바꾼 것입니다.
 두 파일을 나란히 열어 놓고 비교하면 차이가 한눈에 보입니다.


 참고. 왜 두 가지를 다 배우는가
 ==========================================================================

   [jQuery]
     2010년 전후에 만들어진 거의 모든 웹사이트가 사용했습니다.
     회사에 들어가면 기존에 만들어진 JSP 프로젝트를 유지보수하게 되는데,
     그 코드가 대부분 jQuery 로 되어 있습니다. 읽을 줄 알아야 합니다.

   [fetch]
     지금 새로 만드는 프로젝트의 표준입니다.
     브라우저에 기본으로 들어 있어 따로 불러올 파일이 없습니다.

   정리
     기존 코드를 고칠 때는 jQuery, 새로 만들 때는 fetch 를 씁니다.


 참고. 이 화면의 동작 순서 (step1.html 과 동일)
 ==========================================================================

   [브라우저]  jq1.html
       |
       | (1) 조회 버튼 클릭
       | (2) $.ajax 로 Open-Meteo 서버에 요청
       V
   [Open-Meteo 서버]
       |
       | (3) 현재 날씨를 JSON 으로 응답
       V
   [브라우저]
       |
       | (4) success 콜백함수가 자동 실행되며 결과 영역에만 표시


 참고. 가장 큰 문법 차이 세 가지
 ==========================================================================

   1. jQuery 는 파일을 먼저 불러와야 합니다. fetch 는 그럴 필요가 없습니다.

   2. 오류 처리 방식이 다릅니다.
        jQuery : success, error, complete 라는 세 칸에 나눠 씁니다.
        fetch  : try, catch, finally 라는 세 블록에 나눠 씁니다.

   3. 상태 검사 방식이 다릅니다.
        jQuery : 404, 500 이 오면 자동으로 error 로 넘어갑니다.
        fetch  : res.ok 를 개발자가 직접 검사해야 합니다.
-->

<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>1단계 jQuery 버전 - 좌표로 날씨 조회하기</title>

	<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

	<style type="text/css">
		/* 화면을 꾸미는 부분입니다. step1.html 과 완전히 같습니다. */
		body    { font-family:'Malgun Gothic'; padding:24px; background:#f4f7fb; }
		h2      { color:#1d5fa8; }
		.box    { background:#fff; border:1px solid #d5e0ec; border-radius:10px;
		          padding:22px; max-width:620px; }
		button  { background:#7c3aed; color:#fff; border:none; padding:10px 20px;
		          border-radius:7px; cursor:pointer; font-size:14px; }
		button:disabled { background:#a89ac4; cursor:not-allowed; }
		#result { margin-top:18px; padding:20px; background:#f3eeff; border-radius:8px;
		          min-height:60px; }
		.temp   { font-size:44px; font-weight:bold; color:#0f1c2e; }
		.sub    { font-size:14px; color:#4a6280; margin-top:6px; }
		.err    { color:#c0392b; font-weight:bold; }
		.note   { color:#6b7c93; font-size:13px; margin-top:14px; }
		.nav    { margin-top:16px; font-size:14px; }
		.nav a  { color:#7c3aed; font-weight:bold; text-decoration:none; margin-right:12px; }
		.pair   { background:#f3eeff; border-left:4px solid #7c3aed; border-radius:0 8px 8px 0;
		          padding:12px 14px; margin-bottom:14px; font-size:13.5px; color:#5b3a9e; }
	</style>
</head>
<body>

<h2>1단계 jQuery 버전 - 좌표를 고정해서 날씨 조회하기</h2>

<div class="box">

	<div class="pair">
		<b>짝 파일 : step1.html (fetch 버전)</b><br>
		두 파일을 나란히 열어 놓고 코드를 비교해 보세요. 화면과 동작은 완전히 같습니다.
	</div>

	<!--
		id="btn" : 자바스크립트가 이 버튼을 찾을 때 쓰는 이름표입니다.

		여기서도 onclick 속성을 쓰지 않았습니다.
		아래 스크립트에서 $("#btn").on("click", ...) 으로 이벤트를 등록합니다.
		화면 태그와 동작 코드를 분리하는 것이 실무 권장 방식입니다.
	-->
	<button id="btn">서울 날씨 조회</button>

	<!-- 서버에서 받은 결과를 끼워 넣을 빈 그릇입니다. -->
	<div id="result">버튼을 눌러 보세요.</div>

	<p class="note">F12 Network 탭을 열어 두면 요청과 응답을 직접 볼 수 있습니다.
	   fetch 버전과 요청 내용이 완전히 같은 것을 확인해 보세요.</p>

	<div class="nav">
		<a href="index.html">처음으로</a>
		<a href="step1.html">fetch 버전 보기</a>
		<a href="compare.html">문법 대조표</a>
		<a href="jq2.html">2단계로 넘어가기</a>
	</div>
</div>

<script type="text/javascript">
	//===================================================================
	//0. 이 화면에서 함께 쓰는 값 선언
	//===================================================================
	//   서울시청의 위도와 경도입니다. 값이 바뀌지 않으므로 const 를 씁니다.
	//
	//   위도(latitude)  : 적도에서 남북으로 얼마나 떨어졌는지 (한국은 33 ~ 38 사이)
	//   경도(longitude) : 영국 그리니치에서 동서로 얼마나 떨어졌는지 (한국은 125 ~ 130 사이)
	//
	//   2단계에서는 이 값을 코드에 적지 않고 도시 이름으로 검색해 얻어 옵니다.
	const 위도 = 37.5665;
	const 경도 = 126.9780;
	
	//=================================================================
	//1. 날씨 조회 요청 함수 
	//=================================================================
	function 날씨조회(){
		//1.1. 자주 쓰는 태그를 미리 찾아 상수에 담아 둡니다.
		const 결과영역 = $("#result"); //<div id="result">버튼을 눌러 보세요.</div>
		const 버튼 =   $("#btn");     //<button id="btn">서울 날씨 조회</button>
		
		//1.2. 조회 중임을 표시하고  버튼을 잠금(비활성화).
		버튼.prop("disabled",true);
		결과영역.text("날씨를 불러오는 중입니다...");
		
		//1.3. 요청 주소를 만듭니다.
		/*
		참고. 이 API 가 받는 값들의 의미

			latitude   위도
			longitude  경도
			current    지금 시각의 날씨 중 원하는 항목을 콤마로 나열합니다.
			           temperature_2m        지상 2미터 높이의 기온
			           relative_humidity_2m  습도
			           apparent_temperature  체감 온도
			           wind_speed_10m        지상 10미터 높이의 풍속
			timezone   시간대. Asia/Seoul 을 지정해야 한국 시각으로 옵니다.

		주의. timezone 을 지정하지 않으면 세계표준시(GMT)로 옵니다.
		      한국보다 9시간 느린 시각이 표시되어 혼란스럽습니다.
		*/
		//1.4. $.ajax 함수로  meteo.com 서버로  서울 현재 날씨 정보를 비동기 통신으로 요청
		$.ajax({
				 //요청할 meteo.com 서버 페이지 주소 설정 
				 //지금까지는 calc.jsp 처럼 우리 톰캣서버의 파일이었지만
				 //이번에는 https 로 시작하는 외부 회사의 전체 주소를 씁니다
				url : "https://api.open-meteo.com/v1/forecast",
				 
				//요청 전송 방식 get으로 설정  : get요청은? 조회 요청
				type : "get",
				
				//meteo.com 서버 페이지로 보낼 조회 요청시 사용될 요청데이터 설정
				data : { 
						 latitude : 위도,
						 longitude : 경도,
						 current :  "temperature_2m,relative_humidity_2m,apparent_temperature,wind_speed_10m",
						 timezone  : "Asia/Seoul"
						},
				//meteo.com 서버 페이지가 응답할 것으로 예상되는 데이터 유형 설정
				dataType : "json",
				
				//meto.com 서버에 요청 통신에 성공했을때 자동으로 호출되는 function(response){} 콜백함수 정의
				success : function(response){
					/*
					response 로 받은 데이터의 실제 모습

					{
					  "latitude"  : 37.55,                 				<-위도    Asia/Seoul
					  "longitude" : 127.0,								<-경도    Asia/Seoul
					  "timezone"  : "Asia/Seoul",						<- 시간대. Asia/Seoul
					  "current_units" : { "temperature_2m" : "°C" },    <- 지상 2미터 높이의 기온 °C
					  "current" : {
					      "time"                 : "2026-09-04T19:45",  <- 현재 서울 시간 대  
					      "temperature_2m"       : 24.7,				<- 현재 서울 지상 2미터 높이의 기온
					      "relative_humidity_2m" : 68,                  <- 현재 서울 습도
					      "apparent_temperature" : 25.7,				<- 현재 서울 체감 온도
					      "wind_speed_10m"       : 14.9					<- 현재 서울 지상 10미터 높이의 풍속
					  }
					}

					중요. 값들이 current 라는 객체 안에 들어 있습니다.
					     response.temperature_2m 이 아니라
					     response.current.temperature_2m 처럼 점을 두 번 찍어야 합니다.
					*/
					//현재 날씨 값들이 담긴 current : {} 객체를 꺼냅니다.
					const 현재 = response.current;
					/*
					 {
					      "time"                 : "2026-09-04T19:45",  <- 현재 서울 시간 대  
					      "temperature_2m"       : 24.7,				<- 현재 서울 지상 2미터 높이의 기온
					      "relative_humidity_2m" : 68,                  <- 현재 서울 습도
					      "apparent_temperature" : 25.7,				<- 현재 서울 체감 온도
					      "wind_speed_10m"       : 14.9					<- 현재 서울 지상 10미터 높이의 풍속
					  }
					*/
					//브라우저 화면에 표시할 HTML 을 만듭니다.
					const html = `
						<div style="font-size:16px;color:blue;font-weight:bold">서울</div>
						<div class="temp">${현재.temperature_2m}&deg;C</div>
						<div class="sub">
							체감온도 ${현재.apparent_temperature}&deg;C &nbsp;|&nbsp;
							습도 ${현재.relative_humidity_2m}% &nbsp;|&nbsp;
							바람 풍속 ${현재.wind_speed_10m}km/h
						</div>
						<div calss="sub">기준 시각 ${현재.time.replace("T"," ")}</div>`;
					
					//<div id="result">버튼을 눌러 보세요.</div> 의  콘텐츠 영역에 html 상수 문자열 넣어 보여주자
					결과영역.html(html);
					
				},
				//요청 통신에 실패 했을때..... 자동으로 콜백함수 호출 정의
				/*
				 매개변수 3개가 자동으로 전달됩니다.

				  xhttp  통신에 사용된 객체. xhttp.status 에 상태코드가 들어 있습니다.
				  status 오류 상태를 나타내는 글자. "error", "timeout" 등
				  error  오류 메시지
				*/
				error : function(xhttp, status, error){
					
					결과영역.html('<span class="err">날씨를 불러오지 못했습니다.(상태코드 ) : ' + xhttp.status + '</span>');
					
					//console.error 는 콘솔에 빨간 글씨로 오류를 출력합니다.
					//화면에는 보이지 않고 개발자만 F12 로 확인합니다.
					console.log(status, error);
				},
				//요청 성공하든 실패 하든 요청이 끝나면 항상 실행되는 콜백함수 정의 
				complete : function(){
					버튼.prop("disabled",false); // 버튼 잠금 해제를 반드시 여기에 써야 합니다.
				}
	
		});
	}	
		//===================================================================
		//2. 버튼에 클릭 이벤트를 등록합니다.
		//===================================================================
		$("#btn").on("click", 날씨조회);
		  
		
	
	
	


</script>

</body>
</html>
